name: Deploy site
# The whole app runs on GitHub Pages: code on every push, and the live layer
# (last 7 days of NASA FIRMS hotspots) rebuilt every 3 hours before each deploy.
on:
  push:
    branches: [main]
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh live hotspots (NASA FIRMS, last 7 days)
        # keep the committed copy if NASA is down, so a deploy never ships an empty live layer
        run: python tools/fetch_live.py || { rm -rf web/data/live.new; echo "::warning::live refresh failed, deploying the previous live data"; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: d
        uses: actions/deploy-pages@v4
