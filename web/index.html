<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BurnBeat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 12h4l2-6 4 12 3-9 2 3h5' fill='none' stroke='%23e8590c' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<style>
  :root {
    --bg:#f3f1ec; --surface:#fff; --tonal:#f0ebe3; --tonal-2:#e7e0d5; --ink:#1f1b16; --muted:#6f675d; --line:#e4ddd2;
    --accent:#e8590c; --accent-soft:#fde3d3; --up:#c2410c; --up-soft:#fde4d6; --down:#1d6fa5; --down-soft:#dbeaf5;
    --r-lg:28px; --r-md:18px; --shadow:0 1px 2px rgba(31,27,22,.04), 0 6px 24px rgba(31,27,22,.05);
  }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.5 Inter,system-ui,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased }
  h1,h2,h3,.num { font-family:Manrope,Inter,sans-serif }
  .wrap { max-width:1280px; margin:auto; padding:0 20px }
  .bar { display:flex; align-items:center; gap:16px; padding:18px 0 10px; flex-wrap:wrap }
  .logo { display:flex; align-items:center; gap:10px; margin-right:auto }
  .logo svg { width:38px; height:38px; padding:7px; border-radius:12px; background:var(--accent-soft) }
  .logo h1 { font-size:22px; margin:0; letter-spacing:-.02em } .logo small { display:block; color:var(--muted); font:500 12px Inter }
  .pill { border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:8px 16px; font:500 14px Inter; cursor:pointer; transition:background .15s }
  .pill:hover { background:var(--tonal) } .pill.solid { background:var(--ink); color:#fff; border-color:var(--ink) } .pill.solid:hover { background:#3a332b }
  .tools { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:6px 0 18px; scrollbar-width:none }
  .chip { flex:none; border:0; background:var(--tonal); color:var(--ink); border-radius:999px; padding:9px 16px; font:500 14px Inter; cursor:pointer; transition:background .15s, color .15s }
  .chip:hover { background:var(--tonal-2) } .chip.on { background:var(--ink); color:#fff }
  .grid { display:grid; grid-template-columns:5fr 7fr; gap:16px }
  .card { background:var(--surface); border-radius:var(--r-lg); padding:24px; box-shadow:var(--shadow) }
  .full { grid-column:1/-1 }
  .card h2 { font-size:17px; margin:0; letter-spacing:-.01em } .card .sub { color:var(--muted); font-size:13px; margin:2px 0 14px }
  .head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap }
  .hero .where { color:var(--muted); font-weight:500 } .hero .big { font-size:64px; font-weight:800; line-height:1; letter-spacing:-.03em; margin:14px 0 4px }
  .hero .big span { font-size:20px; font-weight:700; color:var(--muted); letter-spacing:0 }
  .badge { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:6px 12px; font:600 14px Inter; margin-top:10px }
  .badge.up { background:var(--up-soft); color:var(--up) } .badge.down { background:var(--down-soft); color:var(--down) } .badge.na { background:var(--tonal); color:var(--muted) }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:22px }
  .stat { background:var(--tonal); border-radius:var(--r-md); padding:14px 16px } .stat b { display:block; font:800 22px Manrope } .stat span { color:var(--muted); font-size:13px }
  #map { height:100%; min-height:360px; border-radius:var(--r-md) } .mapcard { padding:10px; display:flex; flex-direction:column }
  .mapcard .hint { color:var(--muted); font-size:13px; padding:8px 8px 2px }
  .leaflet-container { font-family:Inter; background:var(--tonal) }
  .seg { display:inline-flex; background:var(--tonal); border-radius:999px; padding:4px }
  .seg button { border:0; background:none; padding:7px 14px; border-radius:999px; font:500 13px Inter; color:var(--muted); cursor:pointer }
  .seg button.on { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08) }
  #pulse { height:150px } #cal { height:640px } #line, #harm, #wx { height:290px }
  .note { color:var(--muted); font-size:13px; margin-top:8px }
  footer { color:var(--muted); font-size:13px; padding:28px 0 40px; text-align:center } footer a { color:inherit }
  @media (max-width:860px) { .grid { grid-template-columns:1fr } .hero .big { font-size:52px } #cal { height:720px } .card { padding:18px } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M2 12h4l2-6 4 12 3-9 2 3h5" fill="none" stroke="#e8590c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><h1>BurnBeat</h1><small data-t="tagline"></small></div>
    </div>
    <div class="tools">
      <input class="pill" id="coords" size="22" data-tp="coordsPh">
      <input type="month" class="pill" id="y0"><input type="month" class="pill" id="y1">
      <button class="pill" id="csvCal" data-t="csvCal"></button><button class="pill solid" id="csvPts" data-t="csvPts"></button>
      <div class="seg" id="lang"><button data-v="ru">RU</button><button data-v="ky">KY</button><button data-v="en">EN</button></div>
    </div>
  </div>
  <div class="chips" id="chips"></div>

  <div class="grid">
    <section class="card hero" id="hero"></section>
    <section class="card mapcard"><div id="map"></div><div class="hint" data-t="mapHint"></div></section>
    <section class="card full"><h2 data-t="pulseT"></h2><div class="sub" data-t="pulseS"></div><div id="pulse"></div></section>
    <section class="card full">
      <div class="head">
        <div><h2 data-t="calT"></h2><div class="sub" data-t="calS"></div></div>
        <div class="seg" id="mode"><button data-v="n" class="on" data-t="modeN"></button><button data-v="a" data-t="modeA"></button></div>
      </div>
      <div id="cal"></div>
    </section>
    <section class="card"><h2 data-t="lineT"></h2><div class="sub" data-t="lineS"></div><div id="line"></div></section>
    <section class="card"><h2 data-t="wxT"></h2><div class="sub" data-t="wxS"></div><div id="wx"></div><div class="note" id="wxNote"></div></section>
    <section class="card full"><h2 data-t="harmT"></h2><div class="sub" data-t="harmS"></div><div id="harm"></div><div class="note" id="valid"></div></section>
  </div>
  <footer data-t="footer"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script>
// ---------- translations (KY needs a native-speaker check) ----------
const I18N = {
  ru: { tagline:'Пульс пожаров Кыргызстана · MODIS + VIIRS', csvCal:'Календарь CSV', csvPts:'Очаги CSV', coordsPh:'Координаты: 42.87, 74.59',
    mapHint:'Выберите область кнопкой сверху или нарисуйте свою (□ слева на карте)', pulseT:'Пульс горения', pulseS:'Очаги по месяцам за всю историю — каждый столбик это месяц',
    calT:'Календарь горения', calS:'Гармонизированные очаги (VIIRS-эквивалент) · наведите на клетку', modeN:'Очаги', modeA:'Аномалия к норме',
    lineT:'Этот год против нормы', lineS:'Медиана прошлых лет по месяцам', harmT:'Почему нужна гармонизация', harmS:'Сырой ряд «прыгает» в 2012, когда появился VIIRS',
    wxT:'Огонь и дождь', wxS:'Месяцы сезона 2012–2025: дождь против пожаров (погода — NASA POWER)',
    footer:'Данные: NASA FIRMS (MODIS C6.1, VIIRS S-NPP) и NASA POWER · NASA Space Apps 2026',
    mon:['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'],
    monFull:['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'],
    regions:{ all:'Весь Кыргызстан', chui:'Чуй', talas:'Талас', issykkul:'Иссык-Куль', naryn:'Нарын', jalalabad:'Джалал-Абад', osh:'Ош', batken:'Баткен' },
    custom:'Своя область', km50:'±50 км', fires:'очагов', toNorm:'к норме', normLow:'норма почти ноль', phase:'Фаза сезона', peakNow:'Сейчас пик сезона',
    peakIn:n=>`Пик через ${n} мес.`, peakMonth:m=>`Пик: ${m}`, worst:'Самый горящий год', firesIn:y=>`Очагов за ${y}`, yearNorm:'Норма за год',
    many:'много', few:'мало', above:'выше нормы', below:'ниже нормы', norm:'Норма', raw:'Сырой MODIS → VIIRS', harm:'Гармонизированный',
    valid:(b,r)=>`Проверка (каждый год 2012–2019 по очереди скрыт от модели): ошибка ${b.mae} очага/мес против ${r} у сырого MODIS · смещение ${b.bias_pct}% · корреляция ${b.corr}`,
    rain:'Осадки, % от нормы месяца', fireAnom:'Пожары, % к норме',
    wxNote:r=>`Корреляция осадки ↔ пожары: r = ${r}. ${r < -0.25 ? 'Дождливые месяцы горят заметно меньше.' : 'Связь слабая для этой области.'}`,
    wxNone:'Погода есть только для областей из списка сверху.' },
  ky: { tagline:'Кыргызстандагы өрттөрдүн пульсу · MODIS + VIIRS', csvCal:'Календарь CSV', csvPts:'Өрт очоктору CSV', coordsPh:'Координаттар: 42.87, 74.59',
    mapHint:'Жогорудан аймакты тандаңыз же картага өзүңүз сызыңыз (□ сол жакта)', pulseT:'Күйүү пульсу', pulseS:'Бардык жылдардагы айлык өрт очоктору — ар бир мамыча бир ай',
    calT:'Күйүү календары', calS:'Гармонизацияланган очоктор (VIIRS эквиваленти) · уячага курсорду алып барыңыз', modeN:'Очоктор', modeA:'Нормадан четтөө',
    lineT:'Быйылкы жыл жана норма', lineS:'Мурунку жылдардын айлык медианасы', harmT:'Гармонизация эмне үчүн керек', harmS:'2012-жылы VIIRS пайда болгондо чийки катар секирет',
    wxT:'Өрт жана жаан', wxS:'2012–2025-жылдардагы сезон айлары: жаан-чачын жана өрттөр (аба ырайы — NASA POWER)',
    footer:'Маалымат: NASA FIRMS (MODIS C6.1, VIIRS S-NPP) жана NASA POWER · NASA Space Apps 2026',
    mon:['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'],
    monFull:['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'],
    regions:{ all:'Бүт Кыргызстан', chui:'Чүй', talas:'Талас', issykkul:'Ысык-Көл', naryn:'Нарын', jalalabad:'Жалал-Абад', osh:'Ош', batken:'Баткен' },
    custom:'Өз аймагыңыз', km50:'±50 км', fires:'очок', toNorm:'нормага карата', normLow:'норма нөлгө жакын', phase:'Сезондун фазасы', peakNow:'Азыр сезондун чокусу',
    peakIn:n=>`Чокуга чейин ${n} ай`, peakMonth:m=>`Чокусу: ${m}`, worst:'Эң көп күйгөн жыл', firesIn:y=>`${y}-жылы очоктор`, yearNorm:'Жылдык норма',
    many:'көп', few:'аз', above:'нормадан жогору', below:'нормадан төмөн', norm:'Норма', raw:'Чийки MODIS → VIIRS', harm:'Гармонизацияланган',
    valid:(b,r)=>`Текшерүү (2012–2019-жылдардын ар бири моделден кезек менен жашырылган): ката айына ${b.mae} очок, чийки MODIS — ${r} · жылыш ${b.bias_pct}% · корреляция ${b.corr}`,
    rain:'Жаан-чачын, айлык нормадан %', fireAnom:'Өрттөр, нормадан %',
    wxNote:r=>`Жаан-чачын ↔ өрт корреляциясы: r = ${r}. ${r < -0.25 ? 'Жаандуу айларда өрт байкаларлык азыраак.' : 'Бул аймакта байланыш алсыз.'}`,
    wxNone:'Аба ырайы жогорудагы тизмедеги аймактар үчүн гана бар.' },
  en: { tagline:'Fire pulse of Kyrgyzstan · MODIS + VIIRS', csvCal:'Calendar CSV', csvPts:'Hotspots CSV', coordsPh:'Coordinates: 42.87, 74.59',
    mapHint:'Pick a region above or draw your own (□ on the left of the map)', pulseT:'Burn pulse', pulseS:'Monthly hotspots over the whole record — each bar is one month',
    calT:'Burning calendar', calS:'Harmonized hotspots (VIIRS-equivalent) · hover a cell', modeN:'Hotspots', modeA:'Anomaly vs normal',
    lineT:'This year vs normal', lineS:'Median of past years by month', harmT:'Why harmonization matters', harmS:'The raw series jumps in 2012 when VIIRS arrives',
    wxT:'Fire and rain', wxS:'Fire-season months 2012–2025: rainfall vs hotspots (weather: NASA POWER)',
    footer:'Data: NASA FIRMS (MODIS C6.1, VIIRS S-NPP) and NASA POWER · NASA Space Apps 2026',
    mon:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
    monFull:['January','February','March','April','May','June','July','August','September','October','November','December'],
    regions:{ all:'All Kyrgyzstan', chui:'Chui', talas:'Talas', issykkul:'Issyk-Kul', naryn:'Naryn', jalalabad:'Jalal-Abad', osh:'Osh', batken:'Batken' },
    custom:'Custom area', km50:'±50 km', fires:'hotspots', toNorm:'vs normal', normLow:'normal is near zero', phase:'Season phase', peakNow:'Peak season now',
    peakIn:n=>`Peak in ${n} mo.`, peakMonth:m=>`Peak: ${m}`, worst:'Worst year', firesIn:y=>`Hotspots in ${y}`, yearNorm:'Normal year',
    many:'more', few:'fewer', above:'above normal', below:'below normal', norm:'Normal', raw:'Raw MODIS → VIIRS', harm:'Harmonized',
    valid:(b,r)=>`Validation (each year 2012–2019 held out in turn): error ${b.mae} hotspots/month vs ${r} for raw MODIS · bias ${b.bias_pct}% · correlation ${b.corr}`,
    rain:'Rainfall, % of monthly normal', fireAnom:'Hotspots, % vs normal',
    wxNote:r=>`Rainfall ↔ fire correlation: r = ${r}. ${r < -0.25 ? 'Wet months burn noticeably less.' : 'Weak link for this area.'}`,
    wxNone:'Weather is available for the listed regions only.' },
};
let lang = 'ru'; try { lang = localStorage.getItem('bb_lang') || 'ru'; } catch (e) {}
const T = () => I18N[lang];

const FIRE = ['#fbf3dc','#fcd38d','#f9a23f','#e8590c','#b0300f','#5c1a0b'];
const DIVERGE = ['#1d6fa5','#9cc8e6','#f7f4ee','#f5a77c','#c2410c'];
const BOXES = { all:null, chui:[42.2,72.8,43.3,76.0], talas:[41.9,70.9,42.8,73.2], issykkul:[41.6,76.0,43.0,80.3], naryn:[40.5,73.5,42.3,78.5],
  jalalabad:[40.6,70.6,42.4,74.0], osh:[39.3,72.4,40.9,75.0], batken:[39.5,69.2,40.4,72.4] };
const $ = id => document.getElementById(id);
const axis = { axisLine:{ lineStyle:{ color:'#e4ddd2' } }, axisLabel:{ color:'#6f675d' }, splitLine:{ lineStyle:{ color:'#efe9df' } } };
const font = { fontFamily:'Inter' };
let cells = [], meta, weather = {}, bbox = null, regionKey = 'all', customLabel = '', markers, mode = 'n';
const charts = Object.fromEntries(['pulse','cal','line','harm','wx'].map(k => [k, echarts.init($(k))]));
const median = a => { if (!a.length) return 0; const s = [...a].sort((x,y)=>x-y), k = s.length>>1; return s.length%2 ? s[k] : (s[k-1]+s[k])/2; };
const mean = a => a.reduce((s,x)=>s+x,0) / (a.length||1);
const corr = (a, b) => { const ma = mean(a), mb = mean(b); let n=0, da=0, db=0; a.forEach((x,i) => { n += (x-ma)*(b[i]-mb); da += (x-ma)**2; db += (b[i]-mb)**2; }); return da && db ? n/Math.sqrt(da*db) : 0; };
const z = a => { const m = mean(a), s = Math.sqrt(mean(a.map(x=>(x-m)**2))) || 1; return a.map(x => (x-m)/s); };
const inBox = (la, lo) => !bbox || (la>=bbox[0] && la<=bbox[2] && lo>=bbox[1] && lo<=bbox[3]);
const fmt = n => Math.round(n).toLocaleString(lang==='en' ? 'en-US' : 'ru-RU');
const regionName = () => regionKey ? T().regions[regionKey] : customLabel || T().custom;

// ---------- map ----------
const map = L.map('map', { zoomControl:false }).setView([41.4, 74.6], 6);
L.control.zoom({ position:'bottomright' }).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', { attribution:'Tiles © Esri', maxZoom:16 }).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom:16 }).addTo(map);
const drawn = new L.FeatureGroup().addTo(map);
map.addControl(new L.Control.Draw({ position:'topleft', draw:{ polygon:false, polyline:false, circle:false, marker:false, circlemarker:false,
  rectangle:{ shapeOptions:{ color:'#e8590c', weight:2 } } }, edit:{ featureGroup:drawn, edit:false, remove:false } }));
map.on(L.Draw.Event.CREATED, e => { const b = e.layer.getBounds(); setBox([b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map(x => +x.toFixed(3)), null); });

function setBox(b, key, label = '') {
  bbox = b; regionKey = key; customLabel = label;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.k === key));
  drawn.clearLayers();
  if (b) { const r = L.rectangle([[b[0],b[1]],[b[2],b[3]]], { color:'#e8590c', weight:2, fillOpacity:.04, dashArray:'6 4' }); drawn.addLayer(r); map.fitBounds(r.getBounds(), { padding:[20,20] }); }
  else map.setView([41.4, 74.6], 6);
  const u = new URL(location); b ? u.searchParams.set('bbox', b.join(',')) : u.searchParams.delete('bbox'); history.replaceState(null, '', u);
  render();
}

function aggregate(key) {
  const out = {};
  for (const c of cells) if (inBox(c.la, c.lo)) for (const [ym, n] of Object.entries(c[key])) out[ym] = (out[ym]||0) + n;
  return out;
}

// ---------- static text + language ----------
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = T()[el.dataset.t]);
  document.querySelectorAll('[data-tp]').forEach(el => el.placeholder = T()[el.dataset.tp]);
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.v === lang));
  $('chips').innerHTML = Object.keys(BOXES).map(k => `<button class="chip${k===regionKey?' on':''}" data-k="${k}">${T().regions[k]}</button>`).join('');
  if (meta) { const v = meta.validation; $('valid').textContent = T().valid(v.models[v.best], v.raw_modis.mae); render(); }
}
$('lang').onclick = e => { const v = e.target.dataset.v; if (!v) return; lang = v; try { localStorage.setItem('bb_lang', v); } catch (e) {} applyLang(); };
$('chips').onclick = e => { const k = e.target.dataset.k; if (k) setBox(BOXES[k], k); };

// ---------- render ----------
function render() {
  const t = T(), MON = t.mon;
  const a = $('y0').value, b = $('y1').value, y0 = +a.slice(0,4), y1 = +b.slice(0,4), h = aggregate('h');
  const years = []; for (let y=y0; y<=y1; y++) years.push(y);
  const [ly, lm] = meta.last.split('-').map(Number);
  const val = (y, m) => { const ym = `${y}-${String(m).padStart(2,'0')}`; return (ym < a || ym > b || ym > meta.last) ? null : (h[ym]||0); };
  const med = MON.map((_, i) => median(years.filter(y=>y<ly).map(y=>val(y,i+1)).filter(v=>v!==null)));

  // hero
  const cur = h[meta.last]||0, m0 = med[lm-1], anom = m0 >= 3 ? Math.round(100*(cur-m0)/m0) : null;
  const peak = med.indexOf(Math.max(...med));
  const byYear = years.filter(y=>y<ly).map(y => [y, MON.reduce((s,_,i)=>s+(val(y,i+1)||0),0)]);
  const worst = byYear.reduce((p,q)=>q[1]>p[1]?q:p, [0,-1]);
  const toPeak = (peak - (lm-1) + 12) % 12;
  const phase = toPeak===0 ? t.peakNow : toPeak<=2 ? t.peakIn(toPeak) : t.peakMonth(t.monFull[peak]);
  const badge = anom === null ? `<div class="badge na">${t.normLow}</div>`
    : `<div class="badge ${anom>=0?'up':'down'}">${anom>=0?'▲ +':'▼ '}${anom}% ${t.toNorm} (${fmt(m0)})</div>`;
  $('hero').innerHTML = `
    <div class="where">${regionName()} · ${MON[lm-1]} ${ly}</div>
    <div class="big num">${fmt(cur)} <span>${t.fires}</span></div>${badge}
    <div class="stats">
      <div class="stat"><span>${t.phase}</span><b>${phase}</b></div>
      <div class="stat"><span>${t.worst}</span><b>${worst[0]}</b></div>
      <div class="stat"><span>${t.firesIn(ly-1)}</span><b>${fmt(byYear.at(-1)?.[1]||0)}</b></div>
      <div class="stat"><span>${t.yearNorm}</span><b>${fmt(median(byYear.map(x=>x[1])))}</b></div>
    </div>`;

  // pulse
  const pm = [], pv = [];
  years.forEach(y => MON.forEach((_, i) => { const v = val(y, i+1); if (v===null) return; pm.push(`${MON[i]} ${y}`); pv.push(Math.round(v)); }));
  charts.pulse.setOption({ textStyle:font, grid:{ left:8, right:8, top:6, bottom:22 }, tooltip:{ trigger:'axis', axisPointer:{ type:'none' } },
    xAxis:{ type:'category', data:pm, ...axis, axisTick:{ show:false }, axisLabel:{ color:'#6f675d', interval:i => pm[i].startsWith(MON[0]) && +pm[i].slice(-4)%5===0, formatter:s => s.slice(-4) } },
    yAxis:{ show:false }, visualMap:{ show:false, min:0, max:Math.max(1, ...pv), inRange:{ color:FIRE.slice(1) } },
    series:[{ type:'bar', data:pv, barCategoryGap:'15%', itemStyle:{ borderRadius:[3,3,0,0] } }] }, true);

  // calendar
  const data = [];
  years.forEach((y, yi) => MON.forEach((_, mi) => { const v = val(y, mi+1); if (v===null) return;
    data.push([mi, yi, mode==='a' ? (med[mi] ? Math.round(100*(v-med[mi])/med[mi]) : 0) : Math.round(v)]); }));
  const sorted = data.map(d=>d[2]).sort((p,q)=>p-q), maxN = Math.max(1, sorted[Math.floor(sorted.length*.95)] || 1);
  const vmBase = { calculable:true, orient:'horizontal', left:'center', bottom:0, itemWidth:12, textStyle:{ color:'#6f675d' } };
  charts.cal.setOption({ textStyle:font,
    tooltip:{ formatter:p => `<b>${MON[p.value[0]]} ${years[p.value[1]]}</b><br>${mode==='a' ? (p.value[2]>0?'+':'')+p.value[2]+'% '+t.toNorm : fmt(p.value[2])+' '+t.fires}` },
    grid:{ left:48, right:8, top:28, bottom:64 },
    xAxis:{ type:'category', data:MON, position:'top', ...axis, axisTick:{ show:false }, axisLine:{ show:false } },
    yAxis:{ type:'category', data:years, inverse:true, ...axis, axisTick:{ show:false }, axisLine:{ show:false } },
    visualMap: mode==='a' ? { ...vmBase, min:-100, max:100, inRange:{ color:DIVERGE }, text:[t.above, t.below] }
                          : { ...vmBase, min:0, max:maxN, inRange:{ color:FIRE }, text:[t.many, t.few] },
    series:[{ type:'heatmap', data, itemStyle:{ borderColor:'#fff', borderWidth:2, borderRadius:6 }, label:{ show:years.length<=12, fontSize:10 },
      emphasis:{ itemStyle:{ borderColor:'#1f1b16', borderWidth:2 } } }] }, true);

  // this year vs normal
  const legend = { bottom:0, icon:'roundRect', textStyle:{ color:'#6f675d' } };
  charts.line.setOption({ textStyle:font, tooltip:{ trigger:'axis' }, legend, grid:{ left:40, right:10, top:10, bottom:44 },
    xAxis:{ type:'category', data:MON, ...axis }, yAxis:{ type:'value', ...axis },
    series:[{ name:t.norm, type:'line', smooth:true, symbol:'none', data:med.map(Math.round), lineStyle:{ type:'dashed', width:2 }, color:'#9b9184' },
            { name:String(ly), type:'line', smooth:true, symbolSize:7, data:MON.map((_,i)=>val(ly,i+1)), color:'#e8590c', lineStyle:{ width:3 }, areaStyle:{ opacity:.12 } }] }, true);

  // harmonization
  const m = aggregate('m'), v = aggregate('v'), allYears = [];
  for (let y=+meta.first.slice(0,4)+1; y<ly; y++) allYears.push(y);
  const yr = (o, y) => Object.entries(o).filter(([k])=>+k.slice(0,4)===y).reduce((s,[,n])=>s+n,0);
  charts.harm.setOption({ textStyle:font, tooltip:{ trigger:'axis' }, legend, grid:{ left:48, right:10, top:10, bottom:44 },
    xAxis:{ type:'category', data:allYears, ...axis }, yAxis:{ type:'value', ...axis },
    series:[{ name:t.raw, type:'line', step:'middle', symbol:'none', data:allYears.map(y => y<meta.viirs_start ? yr(m,y) : yr(v,y)), color:'#9b9184', lineStyle:{ width:2 } },
            { name:t.harm, type:'line', smooth:true, symbol:'none', data:allYears.map(y => Math.round(yr(h,y))), color:'#e8590c', lineStyle:{ width:3 } }] }, true);

  // fire and rain: 5 peak months of this area, 2012-2025 (VIIRS era)
  const wk = regionKey === 'all' ? 'kg' : regionKey, w = wk && weather[wk];
  if (!w) { charts.wx.clear(); $('wxNote').textContent = t.wxNone; }
  else {
    const season = med.map((x,i)=>[x,i]).sort((p,q)=>q[0]-p[0]).slice(0,5).map(x=>x[1]+1), pts = [], zf = [], zp = [];
    season.forEach(mo => {
      const ys = []; for (let y=2012; y<ly || (y===ly && mo<=lm); y++) if (w[`${y}-${String(mo).padStart(2,'0')}`]) ys.push(y);
      const f = ys.map(y => h[`${y}-${String(mo).padStart(2,'0')}`]||0), p = ys.map(y => w[`${y}-${String(mo).padStart(2,'0')}`][1]);
      const fm = median(f), pmn = mean(p);
      ys.forEach((y,i) => { if (fm >= 3 && pmn > 0) pts.push([Math.round(100*p[i]/pmn), Math.min(400, Math.round(100*(f[i]-fm)/fm)), `${MON[mo-1]} ${y}`]); });
      zf.push(...z(f.map(Math.log1p))); zp.push(...z(p));
    });
    const r = +corr(zp, zf).toFixed(2);
    charts.wx.setOption({ textStyle:font, grid:{ left:52, right:14, top:14, bottom:44 },
      tooltip:{ formatter:p => `<b>${p.value[2]}</b><br>${t.rain}: ${p.value[0]}%<br>${t.fireAnom}: ${p.value[1]>0?'+':''}${p.value[1]}%` },
      xAxis:{ type:'value', name:t.rain, nameLocation:'middle', nameGap:28, ...axis, nameTextStyle:{ color:'#6f675d' } },
      yAxis:{ type:'value', name:t.fireAnom, nameLocation:'middle', nameGap:38, ...axis, nameTextStyle:{ color:'#6f675d' } },
      series:[{ type:'scatter', data:pts, symbolSize:9, itemStyle:{ color:'#e8590c', opacity:.6 },
        markLine:{ silent:true, symbol:'none', lineStyle:{ color:'#9b9184', type:'dashed' }, label:{ show:false }, data:[{ xAxis:100 }, { yAxis:0 }] } }] }, true);
    $('wxNote').textContent = t.wxNote(r);
  }

  // map dots
  markers && markers.remove(); markers = L.layerGroup().addTo(map);
  const tot = cells.map(c => Object.entries(c.h).filter(([k])=>k>=a && k<=b).reduce((s,[,n])=>s+n,0));
  const mx = Math.max(1, ...tot);
  cells.forEach((c, i) => { if (!tot[i]) return; const k = Math.sqrt(tot[i]/mx);
    L.circleMarker([c.la, c.lo], { radius:2+11*k, stroke:false, fillColor:FIRE[1+Math.min(4, Math.floor(k*5))], fillOpacity:inBox(c.la,c.lo)?.85:.25 })
      .bindTooltip(`${fmt(tot[i])} ${t.fires}`).addTo(markers); });

  Object.values(charts).forEach(c => c.setOption({ toolbox:{ right:0, top:0, feature:{ saveAsImage:{ title:'PNG', name:'burnbeat', pixelRatio:2, backgroundColor:'#fff' } } } }));
}

// ---------- inputs / downloads ----------
function goCoords() {
  const p = $('coords').value.split(/[,;\s]+/).filter(Boolean).map(Number);
  if (!p.every(isFinite)) return;
  if (p.length === 2) { const d = 0.45; setBox([p[0]-d, p[1]-d*1.3, p[0]+d, p[1]+d*1.3].map(x=>+x.toFixed(3)), null, `${p[0]}, ${p[1]} ${T().km50}`); }
  else if (p.length === 4) setBox([Math.min(p[0],p[2]), Math.min(p[1],p[3]), Math.max(p[0],p[2]), Math.max(p[1],p[3])], null);
}
$('coords').onkeydown = e => { if (e.key === 'Enter') goCoords(); };
function download(name, text) { const el = document.createElement('a'); el.href = URL.createObjectURL(new Blob([text], { type:'text/csv' })); el.download = name; el.click(); }
$('csvPts').onclick = async () => {
  const a = $('y0').value, b = $('y1').value, lines = (await (await fetch('data/points.csv')).text()).trim().split('\n');
  download('burnbeat_hotspots.csv', [lines[0], ...lines.slice(1).filter(l => { const [la, lo, d] = l.split(','); const ym = d.slice(0,7); return ym>=a && ym<=b && inBox(+la, +lo); })].join('\n'));
};
$('csvCal').onclick = () => {
  const h = aggregate('h'), y0 = +$('y0').value.slice(0,4), y1 = +$('y1').value.slice(0,4), rows = ['year,' + Array.from({length:12},(_,i)=>i+1).join(',')];
  for (let y=y0; y<=y1; y++) rows.push(y + ',' + Array.from({length:12},(_,i)=>(h[`${y}-${String(i+1).padStart(2,'0')}`]||0).toFixed(1)).join(','));
  download('burnbeat_calendar.csv', rows.join('\n'));
};
$('mode').onclick = e => { const v = e.target.dataset.v; if (!v) return; mode = v; $('mode').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v===v)); render(); };
['y0','y1'].forEach(id => $(id).onchange = render);
addEventListener('resize', () => Object.values(charts).forEach(c => c.resize()));

// ---------- load ----------
applyLang();
Promise.all([fetch('data/cells.json').then(r=>r.json()), fetch('data/meta.json').then(r=>r.json()), fetch('data/weather.json').then(r=>r.ok ? r.json() : {}).catch(()=>({}))]).then(([c, m, w]) => {
  cells = c; meta = m; weather = w;
  const f = +m.first.slice(0,4)+1;   // first year is a partial stub (Nov 2000)
  ['y0','y1'].forEach(id => { $(id).min = `${f}-01`; $(id).max = m.last; });
  $('y0').value = `${f}-01`; $('y1').value = m.last;
  const q = new URLSearchParams(location.search).get('bbox')?.split(',').map(Number);
  const key = q && Object.keys(BOXES).find(k => BOXES[k]?.join(',') === q.join(','));
  applyLang();
  if (q?.length===4 && q.every(isFinite)) setBox(q, key || null); else setBox(null, 'all');
});
</script>
