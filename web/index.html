<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BurnBeat</title>
<meta name="description" content="Harmonized MODIS + VIIRS burning calendar for any place on Earth.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 12h4l2-6 4 12 3-9 2 3h5' fill='none' stroke='%23ff6a1a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0b0e; --panel:#121216; --card:#18181d; --card2:#1f1f25; --ink:#f2ede6; --muted:#9b938a; --dim:#5f5952; --line:rgba(255,255,255,.08);
          --fire:#ff6a1a; --up:#ff7a45; --up-bg:rgba(255,106,26,.14); --down:#6cb4ff; --down-bg:rgba(108,180,255,.13); }
  * { box-sizing:border-box }
  html, body { height:100% }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased }
  h1,h2,.num { font-family:Manrope,Inter,sans-serif; letter-spacing:-.02em }
  .mono { font-family:'JetBrains Mono',ui-monospace,monospace }
  button, input { font:inherit; color:inherit }

  header { height:60px; display:flex; align-items:center; gap:10px; padding:0 16px; border-bottom:1px solid var(--line); background:var(--panel) }
  .brand { display:flex; align-items:center; gap:9px; margin-right:8px; color:var(--ink); text-decoration:none }
  .brand svg { width:22px; height:22px } .brand b { font:800 18px Manrope } .brand small { color:var(--muted); font-size:12px; margin-left:6px }
  .sp { flex:1 }
  .pill { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:7px 13px; font-weight:500; cursor:pointer; white-space:nowrap; text-decoration:none; display:inline-flex; gap:6px; align-items:center }
  .pill:hover { background:var(--card2) } .pill.fire { background:var(--fire); border-color:var(--fire); color:#160800 } .pill:disabled { opacity:.4; cursor:not-allowed }
  .seg { display:inline-flex; background:var(--card); border-radius:999px; padding:3px; border:1px solid var(--line) }
  .seg button { border:0; background:none; padding:5px 10px; border-radius:999px; color:var(--muted); cursor:pointer; font-weight:600; font-size:12px }
  .seg button.on { background:var(--card2); color:var(--ink) }
  input[type=month] { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 10px; color-scheme:dark }

  .app { display:grid; grid-template-columns:minmax(0,1fr) 440px; height:calc(100vh - 60px) }
  /* map side */
  .mapside { position:relative; display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--line) }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:10px 12px; scrollbar-width:none; border-bottom:1px solid var(--line) }
  .chip { flex:none; border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 12px; cursor:pointer; color:#d9d2c9 }
  .chip:hover { background:var(--card2) } .chip.on { background:var(--ink); color:#111; border-color:var(--ink) }
  .chip.sep { border:0; background:none; color:var(--dim); cursor:default; padding:6px 2px }
  #stage { position:relative; flex:1; min-height:300px; cursor:crosshair; touch-action:none; overflow:hidden }
  #stage canvas { position:absolute; inset:0; width:100%; height:100% }
  .hint { position:absolute; left:12px; top:10px; color:var(--muted); font-size:12px; pointer-events:none; background:rgba(11,11,14,.7); padding:4px 8px; border-radius:8px }
  .clock { position:absolute; left:14px; bottom:10px; pointer-events:none }
  .clock .m { font:800 clamp(28px,4vw,48px)/1 Manrope; letter-spacing:-.03em } .clock .n { color:var(--muted); font-size:12px; margin-top:4px } .clock .n b { color:var(--fire) }
  .player { position:absolute; right:12px; bottom:12px; display:flex; gap:8px; align-items:center }
  .player button { width:40px; height:40px; border-radius:50%; border:0; background:var(--fire); color:#160800; font-size:15px; cursor:pointer; box-shadow:0 0 24px rgba(255,106,26,.45) }
  #timeline { height:70px; border-top:1px solid var(--line); cursor:pointer; display:block; width:100% }

  /* panel side */
  .panel { overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px; background:var(--panel) }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px }
  .card h2 { font-size:15px; margin:0 } .card .sub { color:var(--muted); font-size:12px; margin:2px 0 10px }
  .head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px }
  .where { color:var(--muted); font-weight:500 } .where b { color:var(--ink) }
  .big { font:800 52px/1 Manrope; letter-spacing:-.03em; margin:10px 0 2px } .big span { font-size:16px; color:var(--muted); letter-spacing:0; font-weight:600 }
  .badge { display:inline-flex; border-radius:999px; padding:4px 10px; font-weight:600; font-size:13px; margin-top:8px }
  .badge.up { background:var(--up-bg); color:var(--up) } .badge.down { background:var(--down-bg); color:var(--down) } .badge.na { background:var(--card2); color:var(--muted) }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px }
  .stat { background:var(--card2); border-radius:12px; padding:10px 12px } .stat b { display:block; font:800 18px Manrope } .stat span { color:var(--muted); font-size:12px }
  #cal { height:470px } #line, #harm, #wx { height:220px }
  .note { color:var(--muted); font-size:12px; margin-top:6px }
  .src { color:var(--dim); font-size:11px; margin-top:4px }
  .bot { display:flex; gap:12px; align-items:center } .bot p { margin:0; color:#cfc7bd; font-size:13px }
  #loading { position:fixed; inset:0; z-index:9; display:grid; place-items:center; background:var(--bg); color:var(--muted); transition:opacity .6s }
  @media (max-width:1300px) { .brand small { display:none } }
  @media (max-width:1100px) { #csvCal, #csvPts { padding:7px 10px } input[type=month] { width:150px } }
  @media (max-width:980px) {
    .app { display:block; height:auto } .mapside { height:72vh; border-right:0 } header { height:auto; flex-wrap:wrap; padding:10px 12px }
    .brand small { display:none } .panel { overflow:visible }
  }
</style>
</head>
<body>
<div id="loading" class="mono">BURNBEAT · loading 25 years of fire…</div>
<header>
  <a class="brand" href="./"><svg viewBox="0 0 24 24"><path d="M2 12h4l2-6 4 12 3-9 2 3h5" fill="none" stroke="#ff6a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><b>BurnBeat</b><small data-t="tagline"></small></a>
  <div class="sp"></div>
  <input type="month" id="y0" aria-label="from"><input type="month" id="y1" aria-label="to">
  <button class="pill" id="csvCal" data-t="csvCal"></button>
  <button class="pill" id="csvPts" data-t="csvPts"></button>
  <a class="pill fire" href="https://t.me/burn_beat_bot" target="_blank" rel="noopener" data-t="tg"></a>
  <div class="seg" id="lang"><button data-v="ru">RU</button><button data-v="ky">KY</button><button data-v="en">EN</button></div>

      <div class="player"><button id="play" aria-label="play">▶</button></div>
    </div>
    <canvas id="timeline"></canvas>
  </section>

  <aside class="panel">
    <div class="card" id="hero"></div>
    <div class="card">
      <div class="head"><div><h2 data-t="calT"></h2><div class="sub" data-t="calS"></div></div>
        <div class="seg" id="mode"><button data-v="n" class="on" data-t="modeN"></button><button data-v="a" data-t="modeA"></button></div></div>
      <div id="cal"></div>
    </div>
    <div class="card"><h2 id="lineT"></h2><div class="sub" data-t="lineS"></div><div id="line"></div></div>
    <div class="card" id="wxCard"><h2 data-t="wxT"></h2><div class="sub" data-t="wxS"></div><div id="wx"></div><div class="note" id="wxNote"></div></div>
    <div class="card"><h2 data-t="harmT"></h2><div class="sub" id="harmS"></div><div id="harm"></div><div class="note" id="valid"></div></div>
    <div class="card bot"><div style="font-size:30px">📱</div><p data-t="botP"></p></div>
    <div class="src" data-t="footer"></div>
  </aside>
</div>

  world = { land:topojson.feature(topo, topo.objects.land), borders:topojson.mesh(topo, topo.objects.countries, (a, b) => a !== b) };
  gCells = fr.cells.map(c => ({ la:Math.floor(c / 360) - 90 + .5, lo:c % 360 - 180 + .5, h:new Float32Array(N) }));
  fr.frames.forEach((f, i) => { for (let k = 0; k < f.length; k += 2) gCells[f[k]].h[i] = f[k+1]; });
  const mi = new Map(MONTHS.map((m, i) => [m, i]));
  const toArr = o => { const a = new Float32Array(N); for (const [ym, v] of Object.entries(o)) { const i = mi.get(ym); if (i !== undefined) a[i] = v; } return a; };
  kgCells = kc.map(c => ({ la:c.la, lo:c.lo, h:toArr(c.h), m:toArr(c.m), v:toArr(c.v) }));
  const q99 = cells => { const v = []; cells.forEach(c => c.h.forEach(x => { if (x >= 1) v.push(x); })); v.sort((p, q) => p - q); return v[Math.floor(v.length * .99)] || 10; };
  P99G = q99(gCells); P99K = q99(kgCells);
  LUT = new Uint32Array(256);
  for (let k = 0; k < 256; k++) { const c = d3.rgb(d3.interpolateInferno(.45 + .55 * k / 255)), al = Math.round(60 + 195 * k / 255); LUT[k] = (al << 24) | (c.b << 16) | (c.g << 8) | c.r; }
  ['y0','y1'].forEach(id => { $(id).min = MONTHS[0]; $(id).max = MONTHS[N - 1]; }); $('y0').value = MONTHS[0]; $('y1').value = MONTHS[N - 1];
  cur = N - 1;
  const q = new URLSearchParams(location.search).get('bbox')?.split(',').map(Number);
  const pre = q && PRESETS.find(p => p[1] && p[1].join(',') === q.join(','));
  if (q?.length === 4 && q.every(isFinite)) select(pre ? { key:pre[0], bbox:pre[1] } : { key:null, bbox:q, name:T().custom });
  else select({ key:'world', bbox:null });
  $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 700);
  requestAnimationFrame(tick);
});
