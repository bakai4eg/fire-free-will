<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BurnBeat</title>
<meta name="description" content="When and where does it usually burn — and is it worse than usual now? Harmonized NASA MODIS + VIIRS hotspots, 2001 to today, for any place on Earth.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 12h4l2-6 4 12 3-9 2 3h5' fill='none' stroke='%23ff6a1a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0b0e; --panel:#111115; --card:#17171c; --card2:#1f1f26; --ink:#f2ede6; --soft:#d6cfc6; --muted:#9b938a; --dim:#857d74; --line:rgba(255,255,255,.08);
          --fire:#ff6a1a; --fire2:#ffb36b; --up:#ff7a45; --up-bg:rgba(255,106,26,.14); --down:#6cb4ff; --down-bg:rgba(108,180,255,.13); --live:#ff3b30; }
  * { box-sizing:border-box } html, body { height:100% }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased }
  h1,h2,.num { font-family:Manrope,Inter,sans-serif; letter-spacing:-.02em }
  .mono { font-family:'JetBrains Mono',ui-monospace,monospace }
  button, input { font:inherit; color:inherit }

  header { height:58px; display:flex; align-items:center; gap:10px; padding:0 16px; border-bottom:1px solid var(--line); background:var(--panel); position:relative; z-index:20 }
  .brand { display:flex; align-items:center; gap:9px; color:var(--ink); text-decoration:none }
  .brand svg { width:22px; height:22px } .brand b { font:800 18px Manrope }
  .search { position:relative; flex:1; max-width:460px; margin:0 8px }
  .search input { width:100%; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:9px 14px 9px 36px; outline:none }
  .search input:focus { border-color:rgba(255,106,26,.5); background:var(--card2) }
  .search .ic { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none }
  .drop { position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px; display:none; box-shadow:0 20px 50px rgba(0,0,0,.5); max-height:60vh; overflow:auto }
  .drop.on { display:block } .drop .grp { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; padding:8px 10px 4px }
  .drop button { display:flex; width:100%; justify-content:space-between; gap:10px; text-align:left; background:none; border:0; border-radius:9px; padding:8px 10px; cursor:pointer; color:var(--ink) }
  .drop button:hover, .drop button.hi { background:var(--card2) } .drop button span { color:var(--muted); font-size:12px }
  .sp { flex:1 }
  .pill { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:7px 13px; font-weight:500; cursor:pointer; white-space:nowrap; text-decoration:none; display:inline-flex; gap:6px; align-items:center; color:var(--ink) }
  .pill:hover { background:var(--card2) } .pill.tg { border-color:rgba(42,171,238,.45); } .pill.tg:hover { background:rgba(42,171,238,.15) } .pill.fire { background:var(--fire); border-color:var(--fire); color:#160800; font-weight:600 } .pill:disabled { opacity:.35; cursor:not-allowed }
  .seg { display:inline-flex; background:var(--card); border-radius:999px; padding:3px; border:1px solid var(--line) }
  .seg button { border:0; background:none; padding:5px 11px; border-radius:999px; color:var(--muted); cursor:pointer; font-weight:600; font-size:12px }
  .seg button.on { background:var(--card2); color:var(--ink) }

  .app { display:grid; grid-template-columns:minmax(0,1fr) 450px; height:calc(100vh - 58px) }
  .mapside { position:relative; display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--line) }
  .crumbs { display:flex; gap:6px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); min-height:44px; flex-wrap:wrap }
  .crumbs button { border:0; background:none; color:var(--muted); cursor:pointer; padding:4px 6px; border-radius:8px } .crumbs button:hover { color:var(--ink); background:var(--card) }
  .crumbs b { font-weight:600 } .crumbs i { color:var(--dim); font-style:normal }
  #stage { position:relative; flex:1; min-height:300px; cursor:crosshair; touch-action:none; overflow:hidden }
  #stage.globe { cursor:grab } #stage.globe.drag { cursor:grabbing }
  #stage canvas { position:absolute; inset:0; width:100%; height:100% }
  .hint { position:absolute; left:12px; top:10px; color:var(--muted); font-size:12px; pointer-events:none; background:rgba(11,11,14,.72); padding:4px 9px; border-radius:8px }
  .scale { position:absolute; left:12px; top:36px; color:var(--dim); font-size:11px; pointer-events:none }
  .view { position:absolute; right:12px; top:10px } .view button { border:1px solid var(--line); background:rgba(23,23,28,.85); color:var(--soft); border-radius:999px; padding:6px 12px; cursor:pointer; font-weight:600; font-size:12px }
  .zoom button.on { background:var(--fire); color:#160800; border-color:var(--fire) }
  .useview { position:absolute; left:50%; top:12px; transform:translateX(-50%); display:none; border:1px solid rgba(255,106,26,.5); background:rgba(23,23,28,.92); color:var(--ink); border-radius:999px; padding:8px 16px; font-weight:600; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,.4) }
  .useview:hover { background:var(--fire); color:#160800 } .useview.on { display:block }
  #stage.pan { cursor:grab } #stage.pan.drag { cursor:grabbing } #stage.rectmode { cursor:crosshair }
  .zoom { position:absolute; right:12px; top:48px; display:flex; flex-direction:column; gap:6px } .zoom button { width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:rgba(23,23,28,.88); color:var(--ink); font:600 20px Inter; cursor:pointer } .zoom button:hover { background:var(--card2) }
  .clock { position:absolute; left:14px; bottom:12px; pointer-events:none }
  .clock .m { font:800 clamp(28px,4vw,46px)/1 Manrope; letter-spacing:-.03em } .clock .n { color:var(--muted); font-size:12px; margin-top:4px } .clock .n b { color:var(--fire) }
  .clock.live .m { color:var(--live) }
  .player { position:absolute; right:12px; bottom:12px; display:flex; gap:8px; align-items:center }
  .player .play { width:42px; height:42px; border-radius:50%; border:0; background:var(--fire); color:#160800; font-size:15px; cursor:pointer; box-shadow:0 0 24px rgba(255,106,26,.45) }
  .player .now { border:1px solid rgba(255,59,48,.5); background:rgba(255,59,48,.12); color:#ffb4ae; border-radius:999px; padding:9px 14px; cursor:pointer; font-weight:600 }
  .player .now.on { background:var(--live); color:#fff; border-color:var(--live) }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--live); margin-right:6px; vertical-align:1px; animation:pulse 1.6s infinite }
  @keyframes pulse { 50% { opacity:.3 } }
  #timeline { height:66px; border-top:1px solid var(--line); cursor:pointer; display:block; width:100% }

  .panel { overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px; background:var(--panel) }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px }
  .panel.swap .card { animation:fadein .45s ease } @keyframes fadein { from { opacity:.35; transform:translateY(6px) } to { opacity:1; transform:none } }
  @media (prefers-reduced-motion:reduce) { .panel.swap .card { animation:none } }
  .card h2 { font-size:15px; margin:0 } .card .sub { color:var(--muted); font-size:12px; margin:2px 0 10px }
  .head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px }
  .place { font:700 13px Inter; color:var(--muted); text-transform:uppercase; letter-spacing:.08em }
  .story { font:600 17px/1.45 Manrope; color:var(--ink); margin:8px 0 2px; letter-spacing:-.01em }
  .story em { font-style:normal; color:var(--fire2) } .story b { color:var(--ink); font-weight:800 } .story .lv { color:#ffb4ae }
  .big { font:800 46px/1 Manrope; letter-spacing:-.03em; margin:14px 0 2px } .big span { font-size:15px; color:var(--muted); letter-spacing:0; font-weight:600 }
  .badge { display:inline-flex; border-radius:999px; padding:4px 10px; font-weight:600; font-size:13px; margin-top:8px }
  .badge.up { background:var(--up-bg); color:var(--up) } .badge.down { background:var(--down-bg); color:var(--down) } .badge.na { background:var(--card2); color:var(--muted) }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px }
  .stat { background:var(--card2); border-radius:12px; padding:10px 12px } .stat b { display:block; font:800 17px Manrope } .stat span { color:var(--muted); font-size:12px }
  .dl { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap }
  .risk { display:flex; align-items:center; gap:12px; margin-top:8px } .risk .lvl { font:800 26px Manrope } .risk .ico { font-size:30px }
  .lvl.low { color:#58d68d } .lvl.medium { color:#ffb347 } .lvl.high { color:#ff5a4e }
  .why { color:var(--soft); font-size:13px; margin-top:6px } .days { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:12px }
  .day { background:var(--card2); border-radius:10px; padding:8px; text-align:center; font-size:12px; color:var(--muted) } .day b { display:block; font-size:18px; margin:2px 0 }
  .disc { color:var(--dim); font-size:11px; margin-top:8px }
  .live { border-color:rgba(255,59,48,.3); background:linear-gradient(180deg, rgba(255,59,48,.08), var(--card) 60%) }
  .live ul { list-style:none; padding:0; margin:8px 0 0 } .live li { display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid var(--line); color:var(--soft); font-size:13px }
  .live li span { color:var(--muted); white-space:nowrap }
  .vill { margin:6px 0 0; padding:0; list-style:none } .vill li { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; padding:7px 0; border-top:1px solid var(--line); cursor:pointer }
  .vill li:hover b { color:var(--fire2) } .vill .bar { grid-column:1 / -1; height:3px; border-radius:2px; background:linear-gradient(90deg, var(--fire), rgba(255,106,26,.15)) } .vill span { color:var(--muted); font-size:12px }
  #cal { height:460px } #line, #harm, #wx { height:220px }
  .note { color:var(--muted); font-size:12px; margin-top:6px }
  details.card { padding:0 } details.card > summary { list-style:none; cursor:pointer; padding:16px; font:700 15px Manrope; display:flex; justify-content:space-between } details.card > summary::-webkit-details-marker { display:none }
  details.card > summary::after { content:'+'; color:var(--muted) } details[open].card > summary::after { content:'−' }
  details .inner { padding:0 16px 16px } details .inner h3 { font:700 13px Inter; margin:14px 0 2px }
  .src { color:var(--dim); font-size:11px; line-height:1.6 }
  .bot { display:flex; gap:12px; align-items:center } .bot p { margin:0; color:var(--soft); font-size:13px }
  #loading { position:fixed; inset:0; z-index:30; display:grid; place-items:center; background:var(--bg); color:var(--muted); transition:opacity .6s }
  @media (max-width:1100px) { .tg-text { display:none } }
  @media (max-width:980px) {
    .app { display:block; height:auto } .mapside { height:60vh; border-right:0 } header { height:auto; flex-wrap:wrap; padding:10px 12px; row-gap:8px }
    .search { order:9; flex-basis:100%; max-width:none; margin:0 } .panel { overflow:visible }
    .hint { display:none } .scale { top:10px } .clock .n { display:none } .clock .m { font-size:30px }
  }
</style>
</head>
<body>
<div id="loading" class="mono">BURNBEAT · loading 25 years of fire…</div>
<header>
  <a class="brand" href="./"><svg viewBox="0 0 24 24"><path d="M2 12h4l2-6 4 12 3-9 2 3h5" fill="none" stroke="#ff6a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><b>BurnBeat</b></a>
  <div class="search"><span class="ic">⌕</span><input id="q" autocomplete="off" spellcheck="false" aria-label="Search a place"><div class="drop" id="drop"></div></div>
  <div class="sp"></div>
  <div class="seg" id="period"><button data-v="1" data-t="p1"></button><button data-v="5" data-t="p5"></button><button data-v="10" data-t="p10"></button><button data-v="all" class="on" data-t="pall"></button></div>
  <a class="pill tg" href="https://t.me/burn_beat_bot" target="_blank" rel="noopener" aria-label="Telegram bot"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#2AABEE"/><path d="M5.4 11.8l11.2-4.3c.5-.2 1 .1.8.9l-1.9 9c-.1.6-.5.8-1 .5l-2.9-2.1-1.4 1.3c-.2.2-.3.3-.6.3l.2-2.9 5.3-4.8c.2-.2 0-.3-.3-.1l-6.6 4.1-2.8-.9c-.6-.2-.6-.6.1-.9z" fill="#fff"/></svg><span class="tg-text" data-t="tg"></span></a>
  <div class="seg" id="lang"><button data-v="ru">RU</button><button data-v="ky">KY</button><button data-v="en">EN</button></div>
</header>

<div class="app">
  <section class="mapside">
    <div class="crumbs" id="crumbs"></div>
    <div id="stage">
      <canvas id="land"></canvas><canvas id="fire"></canvas><canvas id="marks"></canvas>
      <div class="hint" id="hint"></div>
      <div class="scale" id="scaleNote"></div>
      <div class="view"><button id="viewBtn"></button></div>
      <div class="zoom"><button id="zin" aria-label="zoom in">+</button><button id="zout" aria-label="zoom out">−</button><button id="rect" aria-label="select an area">▭</button></div>
      <button class="useview" id="useView"></button>
      <div class="clock" id="clock"><div class="m mono" id="clockM"></div><div class="n" id="clockN"></div></div>
      <div class="player"><button class="now" id="now"><span class="dot"></span><span data-t="nowBtn"></span></button><button class="play" id="play" aria-label="play">▶</button></div>
    </div>
    <canvas id="timeline"></canvas>
  </section>

  <aside class="panel">
    <div class="card" id="hero"></div>
    <div class="card" id="dangerCard"></div>
    <div class="card live" id="liveCard"></div>
    <div class="card">
      <div class="head"><div><h2 data-t="calT"></h2><div class="sub" id="calS"></div></div>
        <div class="seg" id="mode"><button data-v="n" class="on" data-t="modeN"></button><button data-v="a" data-t="modeA"></button><button data-v="e" data-t="modeE"></button><button data-v="r" data-t="modeR" id="modeR"></button></div></div>
      <div id="cal"></div><div class="note" id="note2001"></div>
    </div>
    <div class="card" id="lineCard"><h2 id="lineT"></h2><div class="sub" id="lineS"></div><div id="line"></div></div>
    <div class="card" id="villCard"><h2 data-t="villT"></h2><div class="sub" data-t="villS"></div><ol class="vill" id="villList"></ol></div>
    <details class="card" id="how"><summary data-t="howT"></summary><div class="inner">
      <p class="note" data-t="howP"></p>
      <h3 data-t="harmT"></h3><div class="sub" id="harmS"></div><div id="harm"></div><div class="note" id="valid"></div>
      <div id="wxBox"><h3 data-t="wxT"></h3><div class="sub" data-t="wxS"></div><div id="wx"></div><div class="note" id="wxNote"></div></div>
      <h3 data-t="srcT"></h3><div class="src" data-t="footer"></div>
    </div></details>
    <div class="card bot"><div style="font-size:30px">📱</div><p data-t="botP"></p></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script>
// =============================== language ===============================
const ruPl = (n, one, few, many) => { n = Math.abs(Math.round(n)) % 100; const d = n % 10; return n > 10 && n < 20 ? many : d === 1 ? one : d >= 2 && d <= 4 ? few : many; };
const ruTimes = r => { if (r < 10) { const v = r.toFixed(1).replace('.', ','); return v.endsWith(',0') ? `${v.slice(0, -2)} ${ruPl(+v.slice(0, -2), 'раз', 'раза', 'раз')}` : `${v} раза`; } const n = Math.round(r); return `${n} ${ruPl(n, 'раз', 'раза', 'раз')}`; };
const x10 = r => r < 10 ? r.toFixed(1) : Math.round(r);
const MON_LOC_RU = ['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
const firesWord = (n, l) => l === 'ru' ? ruPl(n, 'очаг', 'очага', 'очагов') : l === 'en' ? (Math.round(n) === 1 ? 'hotspot' : 'hotspots') : 'очок';
const I18N = {
  ru: { search:'Найти место: страна, город, область…', p1:'Год', p5:'5 лет', p10:'10 лет', pall:'Все 25 лет', tg:'Сводка в Telegram', nowBtn:'Сейчас', world:'Весь мир',
    hint:'Тянуть — двигать · колесо или +/− — масштаб · клик — выбрать страну', hintIn:'Тянуть — двигать · колесо — масштаб · клик — выбрать · Shift+тянуть или ▭ — своя область', useView:'Показать эту область', hintRect:'Протяните рамку вокруг нужной области', hintG:'Клик — выбрать страну · тянуть — вращать Землю',
    sugKg:'Кыргызстан', sugWorld:'Примеры', noRes:'Ничего не найдено', calT:'Календарь горения', calS:'Каждая клетка — месяц. Клик по клетке — показать этот месяц на карте',
    modeN:'Очаги', modeA:'К норме', modeE:'Охват', modeR:'Осадки', legN:['больше очагов','меньше'], legE:['горела большая доля','малая'], legR:['дождливо','сухо'],
    vChrono:'Хронология', vAnalysis:'Анализ',
    calSub:{ n:'Сколько очагов было в каждом месяце. Клик по клетке — этот месяц на карте', a:'Насколько месяц выше или ниже обычного для него', e:'Какая доля территории горела: % клеток (≈100 км, в Кыргызстане ≈25 км), где был хотя бы один очаг', r:'Осадки за месяц, мм (NASA POWER). Сравните с очагами: сухие месяцы горят сильнее' }, unitE:'территории', unitR:'мм', lineT:y => `${y} против нормы`, lineS:(a, b) => `Норма — медиана ${a}–${b} по месяцам, серая полоса — обычный разброс`,
    howT:'Как это посчитано', howP:'Два поколения спутников видят огонь по-разному: новый VIIRS замечает в несколько раз больше мелких очагов, чем старый MODIS. Мы пересчитали 25 лет MODIS в шкалу VIIRS, чтобы прошлое и настоящее можно было честно сравнивать.',
    harmT:'Без гармонизации — ложный скачок в 2012', harmWorld:'Весь мир, очагов в год', harmLocal:'Эта область, очагов в год', wxT:'Огонь и дождь', wxS:'Месяцы сезона 2012–2025 · погода NASA POWER', srcT:'Данные',
    botP:'Каждое утро бот @burn_beat_bot присылает службам Кыргызстана оценку пожарной опасности: сезон, отклонение от нормы, погода, свежие очаги.',
    footer:'NASA FIRMS: MODIS C6.1 (2001–2011, пересчитан), VIIRS S-NPP (2012–2025), VIIRS NOAA-20/21 (последние 7 дней) · погода NASA POWER, Open-Meteo · границы Natural Earth, geoBoundaries · города GeoNames · только растительные пожары, заводы, факелы и вулканы исключены · метод и проверка: docs/METHOD.md',
    mon:['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'], monFull:['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'],
    fires:'очагов', toNorm:'к норме', normLow:'в это время года тут почти не горит', phase:'Сезон', peakNow:'сейчас пик', peakIn:n => `пик через ${n} мес.`, peakMonth:m => `пик: ${m}`,
    worst:'Худший год', yearNorm:'Обычно за год', lastYear:y => `За ${y} год`, norm:'Норма', raw:'Сырые данные', harm:'Гармонизированные',
