<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BurnBeat</title>
<meta name="description" content="When and where does it usually burn — and is it worse than usual now? Harmonized NASA MODIS + VIIRS hotspots, 2001 to today.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 12h4l2-6 4 12 3-9 2 3h5' fill='none' stroke='%23ff6a1a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0b0e; --panel:#111115; --card:#17171c; --card2:#1f1f26; --ink:#f2ede6; --soft:#d6cfc6; --muted:#9b938a; --dim:#5f5952; --line:rgba(255,255,255,.08);
          --fire:#ff6a1a; --fire2:#ffb36b; --up:#ff7a45; --up-bg:rgba(255,106,26,.14); --down:#6cb4ff; --down-bg:rgba(108,180,255,.13); --live:#ff3b30; }
  * { box-sizing:border-box } html, body { height:100% }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased }
  h1,h2,.num { font-family:Manrope,Inter,sans-serif; letter-spacing:-.02em }
  .mono { font-family:'JetBrains Mono',ui-monospace,monospace }
  button { font:inherit; color:inherit }

  header { height:58px; display:flex; align-items:center; gap:10px; padding:0 16px; border-bottom:1px solid var(--line); background:var(--panel) }
  .brand { display:flex; align-items:center; gap:9px; color:var(--ink); text-decoration:none; margin-right:auto }
  .brand svg { width:22px; height:22px } .brand b { font:800 18px Manrope } .brand small { color:var(--muted); font-size:12px; margin-left:4px }
  .pill { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:7px 13px; font-weight:500; cursor:pointer; white-space:nowrap; text-decoration:none; display:inline-flex; gap:6px; align-items:center; color:var(--ink) }
  .pill:hover { background:var(--card2) } .pill.fire { background:var(--fire); border-color:var(--fire); color:#160800; font-weight:600 } .pill:disabled { opacity:.35; cursor:not-allowed }
  .seg { display:inline-flex; background:var(--card); border-radius:999px; padding:3px; border:1px solid var(--line) }
  .seg button { border:0; background:none; padding:5px 11px; border-radius:999px; color:var(--muted); cursor:pointer; font-weight:600; font-size:12px }
  .seg button.on { background:var(--card2); color:var(--ink) }

  .app { display:grid; grid-template-columns:minmax(0,1fr) 450px; height:calc(100vh - 58px) }
  .mapside { position:relative; display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--line) }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:10px 12px; scrollbar-width:none; border-bottom:1px solid var(--line) }
  .chip { flex:none; border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 12px; cursor:pointer; color:var(--soft) }
  .chip:hover { background:var(--card2) } .chip.on { background:var(--ink); color:#111; border-color:var(--ink) }
  .chip.sep { border:0; background:none; color:var(--dim); cursor:default; padding:6px 2px }
  #stage { position:relative; flex:1; min-height:300px; cursor:crosshair; touch-action:none; overflow:hidden }
  #stage canvas { position:absolute; inset:0; width:100%; height:100% }
  .hint { position:absolute; left:12px; top:10px; color:var(--muted); font-size:12px; pointer-events:none; background:rgba(11,11,14,.72); padding:4px 9px; border-radius:8px }
  .scale { position:absolute; right:12px; top:10px; color:var(--dim); font-size:11px; pointer-events:none }
  .clock { position:absolute; left:14px; bottom:12px; pointer-events:none }
  .clock .m { font:800 clamp(28px,4vw,46px)/1 Manrope; letter-spacing:-.03em } .clock .n { color:var(--muted); font-size:12px; margin-top:4px } .clock .n b { color:var(--fire) }
  .clock.live .m { color:var(--live) }
  .player { position:absolute; right:12px; bottom:12px; display:flex; gap:8px; align-items:center }
  .player .play { width:42px; height:42px; border-radius:50%; border:0; background:var(--fire); color:#160800; font-size:15px; cursor:pointer; box-shadow:0 0 24px rgba(255,106,26,.45) }
  .player .now { border:1px solid rgba(255,59,48,.5); background:rgba(255,59,48,.12); color:#ffb4ae; border-radius:999px; padding:9px 14px; cursor:pointer; font-weight:600 }
  .player .now.on { background:var(--live); color:#fff; border-color:var(--live) }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--live); margin-right:6px; vertical-align:1px; animation:pulse 1.6s infinite }
  @keyframes pulse { 50% { opacity:.3 } }
  #timeline { height:66px; border-top:1px solid var(--line); cursor:pointer; display:block; width:100% }

  .panel { overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px; background:var(--panel) }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px }
  .card h2 { font-size:15px; margin:0 } .card .sub { color:var(--muted); font-size:12px; margin:2px 0 10px }
  .head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px }
  .place { font:700 13px Inter; color:var(--muted); text-transform:uppercase; letter-spacing:.08em }
  .story { font:600 17px/1.45 Manrope; color:var(--ink); margin:8px 0 2px; letter-spacing:-.01em }
  .story em { font-style:normal; color:var(--fire2) } .story .lv { color:#ffb4ae }
  .big { font:800 46px/1 Manrope; letter-spacing:-.03em; margin:14px 0 2px } .big span { font-size:15px; color:var(--muted); letter-spacing:0; font-weight:600 }
  .badge { display:inline-flex; border-radius:999px; padding:4px 10px; font-weight:600; font-size:13px; margin-top:8px }
  .badge.up { background:var(--up-bg); color:var(--up) } .badge.down { background:var(--down-bg); color:var(--down) } .badge.na { background:var(--card2); color:var(--muted) }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px }
  .stat { background:var(--card2); border-radius:12px; padding:10px 12px } .stat b { display:block; font:800 17px Manrope } .stat span { color:var(--muted); font-size:12px }
  .dl { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap }
  .live { border-color:rgba(255,59,48,.3); background:linear-gradient(180deg, rgba(255,59,48,.08), var(--card) 60%) }
  .live ul { list-style:none; padding:0; margin:8px 0 0 } .live li { display:flex; justify-content:space-between; padding:6px 0; border-top:1px solid var(--line); color:var(--soft); font-size:13px }
  .live li span { color:var(--muted) }
  #cal { height:460px } #line, #harm, #wx { height:220px }
  .note { color:var(--muted); font-size:12px; margin-top:6px }
  details.card { padding:0 } details.card > summary { list-style:none; cursor:pointer; padding:16px; font:700 15px Manrope; display:flex; justify-content:space-between } details.card > summary::-webkit-details-marker { display:none }
  details.card > summary::after { content:'+'; color:var(--muted) } details[open].card > summary::after { content:'−' }
  details .inner { padding:0 16px 16px } details .inner h3 { font:700 13px Inter; margin:14px 0 2px }
  .src { color:var(--dim); font-size:11px; line-height:1.6 }
  .bot { display:flex; gap:12px; align-items:center } .bot p { margin:0; color:var(--soft); font-size:13px }
  #loading { position:fixed; inset:0; z-index:9; display:grid; place-items:center; background:var(--bg); color:var(--muted); transition:opacity .6s }
  @media (max-width:1250px) { .brand small { display:none } }
  @media (max-width:980px) {
    .app { display:block; height:auto } .mapside { height:68vh; border-right:0 } header { height:auto; flex-wrap:wrap; padding:10px 12px; row-gap:8px }
    .panel { overflow:visible } .tg-text { display:none }
  }
</style>
</head>
<body>
<div id="loading" class="mono">BURNBEAT · loading 25 years of fire…</div>
<header>
  <a class="brand" href="./"><svg viewBox="0 0 24 24"><path d="M2 12h4l2-6 4 12 3-9 2 3h5" fill="none" stroke="#ff6a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><b>BurnBeat</b><small data-t="tagline"></small></a>
  <div class="seg" id="period"><button data-v="1" data-t="p1"></button><button data-v="5" data-t="p5"></button><button data-v="10" data-t="p10"></button><button data-v="all" class="on" data-t="pall"></button></div>
  <a class="pill fire" href="https://t.me/burn_beat_bot" target="_blank" rel="noopener">✈<span class="tg-text" data-t="tg"></span></a>
  <div class="seg" id="lang"><button data-v="ru">RU</button><button data-v="ky">KY</button><button data-v="en">EN</button></div>
</header>

<div class="app">
  <section class="mapside">
    <div class="chips" id="chips"></div>
    <div id="stage">
      <canvas id="land"></canvas><canvas id="fire"></canvas><canvas id="marks"></canvas>
      <div class="hint" data-t="hint"></div>
      <div class="scale" id="scaleNote"></div>
      <div class="clock" id="clock"><div class="m mono" id="clockM"></div><div class="n" id="clockN"></div></div>
      <div class="player"><button class="now" id="now"><span class="dot"></span><span data-t="nowBtn"></span></button><button class="play" id="play" aria-label="play">▶</button></div>
    </div>
    <canvas id="timeline"></canvas>
  </section>

  <aside class="panel">
    <div class="card" id="hero"></div>
    <div class="card live" id="liveCard"></div>
    <div class="card">
      <div class="head"><div><h2 data-t="calT"></h2><div class="sub" data-t="calS"></div></div>
        <div class="seg" id="mode"><button data-v="n" class="on" data-t="modeN"></button><button data-v="a" data-t="modeA"></button></div></div>
      <div id="cal"></div>
    </div>
    <div class="card"><h2 id="lineT"></h2><div class="sub" id="lineS"></div><div id="line"></div></div>
    <details class="card" id="how"><summary data-t="howT"></summary><div class="inner">
      <p class="note" data-t="howP"></p>
      <h3 data-t="harmT"></h3><div class="sub" id="harmS"></div><div id="harm"></div><div class="note" id="valid"></div>
      <div id="wxBox"><h3 data-t="wxT"></h3><div class="sub" data-t="wxS"></div><div id="wx"></div><div class="note" id="wxNote"></div></div>
      <h3 data-t="srcT"></h3><div class="src" data-t="footer"></div>
    </div></details>
    <div class="card bot"><div style="font-size:30px">📱</div><p data-t="botP"></p></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script>
// ======================= text (KY needs a native-speaker check) =======================
const ruPl = (n, one, few, many) => { n = Math.abs(Math.round(n)) % 100; const d = n % 10; return n > 10 && n < 20 ? many : d === 1 ? one : d >= 2 && d <= 4 ? few : many; };
const firesWord = (n, l) => l === 'ru' ? ruPl(n, 'очаг', 'очага', 'очагов') : l === 'en' ? (Math.round(n) === 1 ? 'hotspot' : 'hotspots') : 'очок';
const MON_LOC_RU = ['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
const I18N = {
  ru: { tagline:'когда и где горит · NASA MODIS + VIIRS', p1:'Год', p5:'5 лет', p10:'10 лет', pall:'Все 25 лет', tg:'Сводка в Telegram', nowBtn:'Сейчас',
    hint:'Клик — выбрать место · протянуть — область', calT:'Календарь горения', calS:'Каждая клетка — месяц. Клик по клетке — показать этот месяц на карте',
    modeN:'Очаги', modeA:'К норме', lineT:y => `${y} против нормы`, lineS:(a, b) => `Норма — медиана ${a}–${b} по месяцам`,
    howT:'Как это посчитано', howP:'Два поколения спутников видят огонь по-разному: новый VIIRS замечает в несколько раз больше мелких очагов, чем старый MODIS. Мы пересчитали 25 лет MODIS в шкалу VIIRS, чтобы прошлое и настоящее можно было честно сравнивать.',
    harmT:'Без гармонизации — ложный скачок в 2012', harmWorld:'Весь мир, очагов в год', harmLocal:'Эта область, очагов в год', wxT:'Огонь и дождь', wxS:'Месяцы сезона 2012–2025 · погода NASA POWER', srcT:'Данные',
    botP:'Каждое утро бот @burn_beat_bot присылает службам Кыргызстана оценку пожарной опасности: сезон, отклонение от нормы, погода, свежие очаги.',
    footer:'NASA FIRMS: MODIS C6.1 (2001–2011, пересчитан), VIIRS S-NPP (2012–2025), VIIRS NOAA-20/21 (последние 7 дней) · погода NASA POWER · только растительные пожары, заводы и вулканы исключены · метод и проверка: docs/METHOD.md',
    mon:['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'], monFull:['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'],
    fires:'очагов', toNorm:'к норме', normLow:'в это время года тут почти не горит', phase:'Сезон', peakNow:'сейчас пик', peakIn:n => `пик через ${n} мес.`, peakMonth:m => `пик: ${m}`,
    worst:'Худший год', yearNorm:'Обычно за год', lastYear:y => `За ${y} год`, norm:'Норма', raw:'Сырые данные', harm:'Гармонизированные',
    many:'больше', few:'меньше', above:'выше нормы', below:'ниже нормы', custom:'выбранной области', point:'Точка', csvCal:'⬇ Календарь CSV', csvPts:'⬇ Очаги CSV',
    validW:v => `Проверка: каждый год 2012–2019 по очереди скрывали от модели и сравнивали с тем, что реально увидел VIIRS. Смещение ${v.cell.bias_pct}% (без гармонизации ${v.raw.bias_pct}%), ошибка в месяц в ${Math.round(v.raw.mae_monthly_global / v.cell.mae_monthly_global)} раз меньше.`,
    validK:(b, r) => `Проверка по Кыргызстану: ошибка ${b.mae} очага в месяц против ${r} у сырого MODIS, смещение ${b.bias_pct}%.`,
    rain:'Осадки, % нормы', fireAnom:'Очаги, % к норме', wxNote:r => `r = ${r}: ${r < -0.25 ? 'дождливые месяцы горят заметно меньше.' : 'связь слабая.'}`,
    ptsOnlyKg:'Отдельные очаги — для Кыргызстана', grid:'сетка ≈100 км', gridKg:'сетка ≈25 км · точки — отдельные очаги',
    liveT:'Последние 7 дней', liveNone:'За последние 7 дней спутники не видели очагов в этой области.', liveOutside:'Свежие данные пока есть только для Центральной Азии.',
    liveN:n => `${n} ${ruPl(n, 'очаг', 'очага', 'очагов')} за 7 дней`, liveNow:'СЕЙЧАС', liveDays:'последние 7 дней', newest:'Последний',
    story:s => {
      const peak = s.peak2 !== null ? `<em>${MON_LOC_RU[s.peak]}</em> и <em>${MON_LOC_RU[s.peak2]}</em>` : `<em>${MON_LOC_RU[s.peak]}</em>`;
      let cmp;
      if (s.ratio === null) cmp = 'в это время года тут почти не горит';
      else if (s.ratio >= 2) cmp = `<em>в ${s.ratio < 10 ? s.ratio.toFixed(1).replace('.', ',') : Math.round(s.ratio)} раза больше нормы</em>`;
      else if (s.ratio <= .5 && s.ratio > 0) cmp = `в ${(1 / s.ratio).toFixed(1).replace('.', ',')} раза меньше нормы`;
      else if (s.ratio === 0) cmp = 'ни одного очага';
      else if (Math.abs(s.anom) < 15) cmp = 'около нормы';
      else cmp = s.anom > 0 ? `<em>на ${s.anom}% больше нормы</em>` : `на ${-s.anom}% меньше нормы`;
      const live = s.live === null ? '' : s.live > 0 ? ` <span class="lv">За последние 7 дней спутники заметили ${s.live} ${ruPl(s.live, 'очаг', 'очага', 'очагов')}.</span>` : ' За последние 7 дней очагов не было.';
      return `${s.where === 'мир' ? 'На планете' : 'В ' + s.where} больше всего горит в ${peak}. В ${MON_LOC_RU[s.m]} ${s.y} — ${s.n} ${ruPl(s.nRaw, 'очаг', 'очага', 'очагов')}, ${cmp}.${live}`; } },
  ky: { tagline:'качан жана кайда күйөт · NASA MODIS + VIIRS', p1:'Жыл', p5:'5 жыл', p10:'10 жыл', pall:'25 жыл', tg:'Telegram сводка', nowBtn:'Азыр',
    hint:'Басуу — жерди тандоо · тартуу — аймак', calT:'Күйүү календары', calS:'Ар бир уяча — бир ай. Уячаны бассаңыз, ошол ай картада көрүнөт',
    modeN:'Очоктор', modeA:'Нормага', lineT:y => `${y} жана норма`, lineS:(a, b) => `Норма — ${a}–${b} айлык медианасы`,
    howT:'Бул кантип эсептелген', howP:'Спутниктердин эки мууну өрттү ар башкача көрөт: жаңы VIIRS эски MODISке караганда майда очокторду бир нече эсе көп байкайт. Биз 25 жылдык MODISти VIIRS шкаласына которуп, өткөн менен азыркыны чынчыл салыштырууга мүмкүнчүлүк бердик.',
    harmT:'Гармонизациясыз — 2012-жылы жалган секирик', harmWorld:'Бүт дүйнө, жылына очоктор', harmLocal:'Бул аймак, жылына очоктор', wxT:'Өрт жана жаан', wxS:'2012–2025 сезон айлары · аба ырайы NASA POWER', srcT:'Маалымат',
    botP:'Ар күнү эртең менен @burn_beat_bot Кыргызстандын кызматтарына өрт коркунучун жөнөтөт: сезон, нормадан четтөө, аба ырайы, жаңы очоктор.',
    footer:'NASA FIRMS: MODIS C6.1 (2001–2011, кайра эсептелген), VIIRS S-NPP (2012–2025), VIIRS NOAA-20/21 (акыркы 7 күн) · аба ырайы NASA POWER · өсүмдүк өрттөрү гана, заводдор жана вулкандар алынып салынган',
    mon:['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'], monFull:['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'],
    fires:'очок', toNorm:'нормага карата', normLow:'жылдын бул маалында дээрлик күйбөйт', phase:'Сезон', peakNow:'азыр чокусу', peakIn:n => `чокуга ${n} ай`, peakMonth:m => `чокусу: ${m}`,
    worst:'Эң оор жыл', yearNorm:'Адатта жылына', lastYear:y => `${y}-жылы`, norm:'Норма', raw:'Чийки маалымат', harm:'Гармонизацияланган',
    many:'көп', few:'аз', above:'нормадан жогору', below:'нормадан төмөн', custom:'тандалган аймак', point:'Чекит', csvCal:'⬇ Календарь CSV', csvPts:'⬇ Очоктор CSV',
    validW:v => `Текшерүү: 2012–2019-жылдардын ар бири моделден кезек менен жашырылып, VIIRS көргөнү менен салыштырылды. Жылыш ${v.cell.bias_pct}% (гармонизациясыз ${v.raw.bias_pct}%), айлык ката ${Math.round(v.raw.mae_monthly_global / v.cell.mae_monthly_global)} эсе аз.`,
    validK:(b, r) => `Кыргызстан боюнча текшерүү: ката айына ${b.mae} очок, чийки MODIS — ${r}, жылыш ${b.bias_pct}%.`,
    rain:'Жаан, нормадан %', fireAnom:'Очоктор, нормадан %', wxNote:r => `r = ${r}: ${r < -0.25 ? 'жаандуу айларда өрт байкаларлык азыраак.' : 'байланыш алсыз.'}`,

    if (!POINTS.has(ym)) POINTS.set(ym, []); POINTS.get(ym).push([+p[0], +p[1], regionOf(+p[1], +p[0])]); });
  const q99 = cells => { const v = []; cells.forEach(c => c.h.forEach(x => { if (x >= 1) v.push(x); })); v.sort((p, q) => p - q); return v[Math.floor(v.length * .99)] || 10; };
  P99G = q99(gCells); P99K = q99(kgCells);
  LUT = new Uint32Array(256);
  for (let k = 0; k < 256; k++) { const c = d3.rgb(d3.interpolateInferno(.45 + .55 * k / 255)), al = Math.round(60 + 195 * k / 255); LUT[k] = (al << 24) | (c.b << 16) | (c.g << 8) | c.r; }
  if (!LIVE) $('now').style.display = 'none';
  cur = N - 1;
  const q = new URLSearchParams(location.search).get('bbox')?.split(',').map(Number);
  const pre = q && PRESETS.find(p => p[1] && p[1].join(',') === q.join(','));
  if (q?.length === 4 && q.every(isFinite)) select(pre ? { key:pre[0], bbox:pre[1] } : { key:null, bbox:q });
  else select({ key:'world', bbox:null });
  $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 700);
  requestAnimationFrame(tick);
});
