<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BurnBeat</title>
<meta name="description" content="25 years of the planet's fires, harmonized from NASA MODIS and VIIRS.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 12h4l2-6 4 12 3-9 2 3h5' fill='none' stroke='%23ff6a1a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>if (/[?&]bbox=/.test(location.search)) location.replace('tool.html' + location.search);</script>
<style>
  :root { --bg:#07070a; --ink:#f4efe8; --muted:#9a9189; --dim:#5d5750; --line:rgba(255,255,255,.08); --fire:#ff6a1a; --glass:rgba(16,14,13,.72); }
  * { box-sizing:border-box } html { scroll-behavior:smooth }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden }
  h1,h2,.display { font-family:Manrope,Inter,sans-serif; letter-spacing:-.03em }
  .mono { font-family:'JetBrains Mono',ui-monospace,monospace }

  /* stage: map that stays behind the story */
  #stage { position:fixed; inset:0; z-index:0 }
  #stage canvas { position:absolute; inset:0; width:100%; height:100%; transition:opacity 1.2s }
  body.hero-on #fire, body.hero-on #land { opacity:.38 }
  #vignette { position:fixed; inset:0; z-index:1; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.75) 100%) }

  /* HUD */
  .top { position:fixed; top:0; left:0; right:0; z-index:5; display:flex; align-items:center; gap:14px; padding:18px 24px }
  .brand { display:flex; align-items:center; gap:10px; font:800 18px Manrope; margin-right:auto; color:var(--ink); text-decoration:none }
  .brand svg { width:22px; height:22px }
  .lang { display:flex; gap:2px; background:rgba(255,255,255,.06); border-radius:999px; padding:3px }
  .lang button { border:0; background:none; color:var(--muted); font:600 12px Inter; padding:6px 10px; border-radius:999px; cursor:pointer }
  .lang button.on { background:rgba(255,255,255,.14); color:var(--ink) }
  .btn { border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.04); color:var(--ink); border-radius:999px; padding:9px 16px; font:600 14px Inter; cursor:pointer; text-decoration:none; transition:background .2s }
  .btn:hover { background:rgba(255,255,255,.12) } .btn.fire { background:var(--fire); border-color:var(--fire); color:#120800 } .btn.fire:hover { background:#ff8240 }

  .clock { position:fixed; left:24px; bottom:96px; z-index:4; pointer-events:none; transition:opacity .6s }
  .clock .m { font:800 clamp(40px,7vw,96px)/.9 Manrope; letter-spacing:-.04em }
  .clock .n { color:var(--muted); font-size:14px; margin-top:8px } .clock .n b { color:var(--fire); font-weight:600 }
  .pulse { position:fixed; left:0; right:0; bottom:0; height:84px; z-index:4; background:linear-gradient(transparent, rgba(0,0,0,.7)) }
  .pulse canvas { width:100%; height:100% }
  .player { position:fixed; right:24px; bottom:100px; z-index:5; display:flex; gap:8px; align-items:center }
  .player input { width:min(260px,40vw); accent-color:var(--fire) }

  /* story */
  main { position:relative; z-index:3 }
  .chapter { min-height:100vh; display:flex; align-items:center; padding:90px 24px 190px; pointer-events:none }
  .card { pointer-events:auto; max-width:440px; background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:24px; padding:28px; opacity:0; transform:translateY(30px); transition:opacity .9s, transform .9s }
  .chapter.in .card { opacity:1; transform:none }
  .card .kicker { color:var(--fire); font:600 12px Inter; letter-spacing:.14em; text-transform:uppercase }
  .card h2 { font-size:clamp(28px,3.4vw,40px); line-height:1.05; margin:10px 0 12px } .card p { color:#cfc7bd; margin:0 0 12px }
  .card canvas { width:100%; display:block; margin-top:8px }
  .stat { display:flex; gap:20px; margin:14px 0 4px } .stat div b { display:block; font:800 30px Manrope; color:var(--ink) } .stat div span { color:var(--muted); font-size:13px }
  .legend { display:flex; gap:14px; color:var(--muted); font-size:13px; margin-top:8px } .legend i { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:6px }
  .hero { justify-content:center; text-align:center }
  .hero .card { background:radial-gradient(ellipse at center, rgba(7,7,10,.82) 0%, rgba(7,7,10,.55) 45%, transparent 72%); border:0; backdrop-filter:none; -webkit-backdrop-filter:none; max-width:900px; padding:70px 60px }
  .hero p, .hero .scrollhint { text-shadow:0 2px 16px #000 }
  .hero h1 { font-size:clamp(52px,10vw,148px); line-height:.88; margin:0 0 18px; font-weight:800 }
  .hero h1 span { color:var(--fire); text-shadow:0 0 60px rgba(255,106,26,.55) }
  .hero p { font-size:clamp(17px,2vw,22px); color:#d9d1c7; max-width:620px; margin:0 auto 26px }
  .scrollhint { color:var(--muted); font-size:13px; margin-top:28px; animation:bob 2s infinite } @keyframes bob { 50% { transform:translateY(6px) } }
  .phone { width:270px; border-radius:34px; border:8px solid #1b1a19; background:#0e1621; padding:14px 12px; margin:6px auto 0; box-shadow:0 30px 80px rgba(0,0,0,.6) }
  .bubble { background:#182533; border-radius:14px; padding:12px; font-size:13px; line-height:1.45; color:#e9edf1; white-space:pre-line }
  .here { color:var(--muted); font-size:13px } .here b { color:var(--ink) }
  footer { position:relative; z-index:3; text-align:center; color:var(--dim); font-size:13px; padding:40px 24px 130px } footer a { color:var(--muted) }
  #loading { position:fixed; inset:0; z-index:10; display:grid; place-items:center; background:var(--bg); color:var(--muted); transition:opacity .8s }
  @media (max-width:760px) { .chapter { align-items:flex-end; padding:90px 14px 120px } .card { padding:20px } .clock { bottom:92px; left:16px } .player { right:12px; bottom:96px } .top { padding:12px 14px } }
  @media (prefers-reduced-motion:reduce) { .card { transition:none } .scrollhint { animation:none } }
</style>
</head>
<body>
<div id="loading" class="mono">BURNBEAT · loading 25 years of fire…</div>
<div id="stage"><canvas id="land"></canvas><canvas id="fire"></canvas><canvas id="marks"></canvas></div>
<div id="vignette"></div>

<div class="top">
  <a class="brand" href="./"><svg viewBox="0 0 24 24"><path d="M2 12h4l2-6 4 12 3-9 2 3h5" fill="none" stroke="#ff6a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>BurnBeat</a>
  <div class="lang" id="lang"><button data-v="ru">RU</button><button data-v="ky">KY</button><button data-v="en">EN</button></div>
  <a class="btn" href="tool.html" data-t="toolBtn"></a>
</div>

<div class="clock" id="clock"><div class="m mono" id="clockM">—</div><div class="n" id="clockN"></div></div>
<div class="player"><button class="btn" id="play">❚❚</button><input type="range" id="scrub" min="0" max="0" value="0" aria-label="month"></div>
<div class="pulse"><canvas id="pulse"></canvas></div>

<main>
  <section class="chapter hero" data-ch="hero"><div class="card">
    <h1><span>Burn</span>Beat</h1>
    <p data-t="heroP"></p>
    <a class="btn fire" href="#c1" data-t="heroBtn"></a>
    <div class="scrollhint" data-t="scroll"></div>
  </div></section>

  <section class="chapter" id="c1" data-ch="rhythm"><div class="card">
    <div class="kicker" data-t="k1"></div><h2 data-t="h1"></h2><p data-t="p1"></p>
    <canvas id="calendar" height="300"></canvas>
    <div class="legend"><span data-t="calLegend"></span></div>
  </div></section>

  <section class="chapter" data-ch="clocks"><div class="card">
    <div class="kicker" data-t="k2"></div><h2 data-t="h2"></h2><p data-t="p2"></p>
    <canvas id="harm" height="200"></canvas>
    <div class="legend"><span><i style="background:#777"></i><span data-t="raw"></span></span><span><i style="background:#ff6a1a"></i><span data-t="harmonized"></span></span></div>
    <div class="stat" id="valStat"></div>
  </div></section>

  <section class="chapter" data-ch="explore"><div class="card">
    <div class="kicker" data-t="k3"></div><h2 data-t="h3"></h2><p data-t="p3"></p>
    <div class="here" id="hereTxt"></div>
    <canvas id="local" height="230"></canvas>
  </div></section>

  <section class="chapter" data-ch="kg"><div class="card">
    <div class="kicker" data-t="k4"></div><h2 data-t="h4"></h2><p data-t="p4"></p>
    <div class="phone"><div class="bubble" data-t="bot"></div></div>
  </div></section>

  <section class="chapter" data-ch="cta"><div class="card">
    <div class="kicker" data-t="k5"></div><h2 data-t="h5"></h2><p data-t="p5"></p>
    <a class="btn fire" href="tool.html" data-t="toolBtn"></a>
  </div></section>
</main>
<footer data-t="footer"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const I18N = {

    k1:'01 · Ритм', h1:'Планета горит по расписанию', p1:'Каждая клетка — месяц. Строки — годы с 2001-го. Один и тот же рисунок повторяется четверть века: огонь — это сезон, а не случайность.', calLegend:'темнее — меньше очагов, ярче — больше',
    k2:'02 · Сломанные часы', h2:'В 2012 году спутники «соврали»', p2:'Новый прибор VIIRS видит в несколько раз больше мелких пожаров, чем старый MODIS. Если склеить ряды как есть, кажется, что мир внезапно загорелся. Мы пересчитали 25 лет в одну шкалу.',
    raw:'сырые данные', harmonized:'гармонизированный ряд', vErr:'ошибка вместо', vCorr:'корреляция по клеткам',
    k3:'03 · Ваша земля', h3:'Нажмите на любое место карты', p3:'Календарь горения для любой точки планеты: когда там обычно горит и какой год был худшим.', pick:'Кликните по карте, чтобы выбрать место', peak:'пик', worst:'худший год', perYear:'очагов в год (медиана)',
    k4:'04 · Сейчас', h4:'Кыргызстан: предупредить до огня', p4:'Каждое утро бот BurnBeat присылает службам и фермерам оценку пожарной опасности: сезон, отклонение от нормы, погода, свежие очаги со спутников.',
    bot:'🔥 Пожарная сводка · 15 ноября\n\n🟠 Чуйская — риск СРЕДНИЙ\nЗа сутки: 1 · С 8 ноября: 41 (норма 2.6, ▲ в 15 раз)\nСезон: осенние палы\nПочему: выше нормы, сухо\n🗺 Открыть карту',
    k5:'05 · Инструмент', h5:'Для тех, кто планирует сезон', p5:'Календарь горения по областям, аномалии к норме, связь с дождём, CSV и PNG для отчётов. На трёх языках.',
    footer:'Данные: NASA FIRMS (MODIS C6.1, VIIRS S-NPP / NOAA-20), NASA POWER, Open-Meteo · NASA Space Apps Challenge 2026',
    months:['ЯНВ','ФЕВ','МАР','АПР','МАЙ','ИЮН','ИЮЛ','АВГ','СЕН','ОКТ','НОЯ','ДЕК'], fires:'очагов на планете', firesHere:'очагов' },
  ky: { toolBtn:'Курал →', heroP:'Планетадагы 25 жылдык өрттөр 40 секундда. NASA MODIS жана VIIRS спутниктери бир чынчыл катарга бириктирилди.', heroBtn:'Тарыхты көрүү ↓', scroll:'ылдый жылдырыңыз',
    k1:'01 · Ыргак', h1:'Планета график менен күйөт', p1:'Ар бир уяча — бир ай. Саптар — 2001-жылдан бери жылдар. Бир эле сүрөт чейрек кылым кайталанат: өрт — бул сезон, кокустук эмес.', calLegend:'караңгы — аз, ачык — көп очок',
    k2:'02 · Бузулган саат', h2:'2012-жылы спутниктер «калп айтты»', p2:'Жаңы VIIRS прибору эски MODISке караганда майда өрттөрдү бир нече эсе көп көрөт. Катарларды ошол бойдон бириктирсек, дүйнө күтүлбөгөн жерден күйүп кеткендей көрүнөт. Биз 25 жылды бир шкалага келтирдик.',
    raw:'чийки маалымат', harmonized:'гармонизацияланган катар', vErr:'ката, мурун', vCorr:'уячалар боюнча корреляция',
    k3:'03 · Сиздин жер', h3:'Картанын каалаган жерин басыңыз', p3:'Планетанын каалаган чекити үчүн күйүү календары: ал жерде качан күйөт жана кайсы жыл эң оор болгон.', pick:'Жерди тандоо үчүн картаны басыңыз', peak:'чокусу', worst:'эң оор жыл', perYear:'жылына очок (медиана)',
    k4:'04 · Азыр', h4:'Кыргызстан: өрткө чейин эскертүү', p4:'Ар күнү эртең менен BurnBeat боту кызматтарга жана фермерлерге өрт коркунучун жөнөтөт: сезон, нормадан четтөө, аба ырайы, спутниктен жаңы очоктор.',
    bot:'🔥 Өрт сводкасы · 15-ноябрь\n\n🟠 Чүй — коркунуч ОРТОЧО\nБир суткада: 1 · 8-ноябрдан бери: 41 (норма 2.6, ▲ 15 эсе)\nСезон: күзгү өрттөр\nЭмне үчүн: нормадан жогору, кургак\n🗺 Картаны ачуу',
    k5:'05 · Курал', h5:'Сезонду пландагандар үчүн', p5:'Облустар боюнча күйүү календары, нормадан четтөө, жаан менен байланыш, отчеттор үчүн CSV жана PNG. Үч тилде.',
    footer:'Маалымат: NASA FIRMS (MODIS C6.1, VIIRS S-NPP / NOAA-20), NASA POWER, Open-Meteo · NASA Space Apps Challenge 2026',
    months:['ЯНВ','ФЕВ','МАР','АПР','МАЙ','ИЮН','ИЮЛ','АВГ','СЕН','ОКТ','НОЯ','ДЕК'], fires:'очок планетада', firesHere:'очок' },
  en: { toolBtn:'Open the tool →', heroP:'25 years of the planet\'s fires in 40 seconds. NASA MODIS and VIIRS satellites, merged into one honest record.', heroBtn:'Watch the story ↓', scroll:'scroll down',
    k1:'01 · Rhythm', h1:'The planet burns on schedule', p1:'Each cell is a month, each row a year since 2001. The same pattern repeats for a quarter century: fire is a season, not an accident.', calLegend:'darker — fewer hotspots, brighter — more',
    k2:'02 · Broken clocks', h2:'In 2012 the satellites "lied"', p2:'The new VIIRS sensor sees several times more small fires than the old MODIS. Stitch the records together as they are and the world seems to suddenly catch fire. We put 25 years on one scale.',
    raw:'raw data', harmonized:'harmonized record', vErr:'error, instead of', vCorr:'cell-level correlation',
    k3:'03 · Your land', h3:'Click anywhere on the map', p3:'A burning calendar for any place on Earth: when it usually burns and which year was the worst.', pick:'Click the map to pick a place', peak:'peak', worst:'worst year', perYear:'hotspots a year (median)',
    k4:'04 · Now', h4:'Kyrgyzstan: warn before the fire', p4:'Every morning the BurnBeat bot sends services and farmers a fire-danger rating: season, anomaly vs normal, weather and fresh satellite detections.',
    bot:'🔥 Fire brief · 15 November\n\n🟠 Chui — risk MEDIUM\nLast 24 h: 1 · Since 8 Nov: 41 (normal 2.6, ▲ 15×)\nSeason: autumn field burning\nWhy: above normal, dry\n🗺 Open map',
    k5:'05 · The tool', h5:'For those who plan the season', p5:'Burning calendar by region, anomalies vs normal, the rain link, CSV and PNG for reports. In three languages.',
    footer:'Data: NASA FIRMS (MODIS C6.1, VIIRS S-NPP / NOAA-20), NASA POWER, Open-Meteo · NASA Space Apps Challenge 2026',
    months:['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'], fires:'hotspots on the planet', firesHere:'hotspots' },
};
let lang = 'ru'; try { lang = localStorage.getItem('bb_lang') || 'ru'; } catch (e) {}
const T = () => I18N[lang];
const $ = id => document.getElementById(id);
const DPR = Math.min(2, window.devicePixelRatio || 1);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FIRE_RES = 0.5;

let G, S, world, proj, path, W, H, pts = [], frameIdx = 0, playing = !REDUCED, picked = null, chapter = 'hero';
const C = { land:$('land'), fire:$('fire'), marks:$('marks') };
const ctx = Object.fromEntries(Object.entries(C).map(([k, c]) => [k, c.getContext('2d')]));

// ember sprite: soft radial glow, drawn additively
const sprite = document.createElement('canvas'); sprite.width = sprite.height = 64;
{ const g = sprite.getContext('2d'), r = g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,'rgba(255,240,200,1)'); r.addColorStop(.18,'rgba(255,170,60,.9)'); r.addColorStop(.45,'rgba(255,90,20,.35)'); r.addColorStop(1,'rgba(255,60,0,0)');
  g.fillStyle = r; g.fillRect(0,0,64,64); }

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = T()[el.dataset.t]);
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.v === lang));
  if (G) { drawCalendar(); drawHarm(1); drawLocal(); updateClock(); valStat(); }
}
$('lang').onclick = e => { const v = e.target.dataset.v; if (!v) return; lang = v; try { localStorage.setItem('bb_lang', v); } catch (e) {} applyLang(); };

function size(c, h) { const r = c.getBoundingClientRect(); c.width = r.width * DPR; c.height = (h || r.height) * DPR; return [r.width, h || r.height]; }

function layout() {
  W = innerWidth; H = innerHeight;
  Object.values(C).forEach(c => { c.width = W * DPR; c.height = H * DPR; });
  Object.values(ctx).forEach(g => g.setTransform(DPR,0,0,DPR,0,0));
  // glow is blurry anyway: render the fire layer at half resolution (4x fewer pixels to blend)
  C.fire.width = W * FIRE_RES; C.fire.height = H * FIRE_RES; ctx.fire.setTransform(FIRE_RES,0,0,FIRE_RES,0,0);
  const focus = chapter === 'kg';
  proj = d3.geoEqualEarth();
  if (focus) proj.center([0,0]).rotate([-74.5,0]).scale(W*1.9).translate([W*0.62, H*0.5 + W*1.9*0.79]);   // zoom on Central Asia
  else proj.fitExtent([[24, 70], [W - 24, H - 100]], { type:'Sphere' });
  path = d3.geoPath(proj, ctx.land);
  drawLand();
  pts = G.cells.map(c => { const lat = Math.floor(c/360) - 90 + .5, lon = c%360 - 180 + .5; return proj([lon, lat]); });
  prepareGrid();
  ctx.fire.clearRect(0,0,W,H); drawFrame(frameIdx, 1); drawMarks();
  const [pw] = size($('pulse')); drawPulse();
}

function drawLand() {
  const g = ctx.land; g.clearRect(0,0,W,H);
  g.beginPath(); path({ type:'Sphere' }); g.fillStyle = '#0b0b0f'; g.fill();
  g.beginPath(); path(d3.geoGraticule10()); g.strokeStyle = 'rgba(255,255,255,.035)'; g.lineWidth = .6; g.stroke();
  g.beginPath(); path(world.land); g.fillStyle = '#16151a'; g.fill();
  g.beginPath(); path(world.borders); g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = .5; g.stroke();
}

const scaleR = () => Math.max(1.6, (proj.scale() / 160) * 2.2);
// Fast path for the world view: every cell is one pixel of a small offscreen image (one putImageData per frame),
// then drawn scaled up twice: blurred (glow) and sharp (cores). The sprite path is kept for the zoomed view.
const GRID = 3; let off, offCtx, img, buf, pix, LUT;
function prepareGrid() {
  const gw = Math.ceil(W / GRID), gh = Math.ceil(H / GRID);
  off = document.createElement('canvas'); off.width = gw; off.height = gh; offCtx = off.getContext('2d');
  img = offCtx.createImageData(gw, gh); buf = new Uint32Array(img.data.buffer);
  pix = new Int32Array(pts.length).fill(-1);
  pts.forEach((p, i) => { if (!p) return; const x = Math.round(p[0] / GRID), y = Math.round(p[1] / GRID); if (x >= 0 && y >= 0 && x < gw && y < gh) pix[i] = y * gw + x; });
  if (!LUT) { LUT = new Uint32Array(256);
    for (let k = 0; k < 256; k++) { const c = d3.rgb(d3.interpolateInferno(0.45 + 0.55 * k / 255)), a = Math.round(60 + 195 * k / 255);
      LUT[k] = (a << 24) | (c.b << 16) | (c.g << 8) | c.r; } }
}
function drawFrame(i, fade) {
  const g = ctx.fire, fr = G.frames[i]; if (!fr) return;
  g.globalCompositeOperation = 'destination-out'; g.fillStyle = `rgba(0,0,0,${fade})`; g.fillRect(0,0,W,H);   // embers fade
  g.globalCompositeOperation = 'lighter';
  const base = scaleR(), max = G.p99;
  if (base < 6 && buf) {                                   // world view
    buf.fill(0); const lmax = Math.log1p(max);
    for (let k = 0; k < fr.length; k += 2) { const q = pix[fr[k]]; if (q < 0) continue;
      const v = Math.min(255, Math.round(255 * Math.log1p(fr[k+1]) / lmax)); if (buf[q] >>> 0 < LUT[v] >>> 0) buf[q] = LUT[v]; }
    offCtx.putImageData(img, 0, 0);
    g.imageSmoothingEnabled = true;
    g.filter = 'blur(4px)'; g.globalAlpha = .9; g.drawImage(off, 0, 0, W, H);
    g.filter = 'none'; g.globalAlpha = .55; g.drawImage(off, 0, 0, W, H);
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; return;
  }
  for (let k = 0; k < fr.length; k += 2) {
    const p = pts[fr[k]]; if (!p || fr[k+1] < 2) continue;      // single detections add nothing visible
    const v = Math.min(1, Math.log1p(fr[k+1]) / Math.log1p(max)), r = base * (0.5 + 2.1 * v * v);
    if (p[0] < -r || p[0] > W + r || p[1] < -r || p[1] > H + r) continue;
    g.globalAlpha = 0.12 + 0.55 * v; g.drawImage(sprite, p[0] - r, p[1] - r, 2*r, 2*r);
  }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}

function drawMarks() {
  const g = ctx.marks; g.clearRect(0,0,W,H);
  if (!picked) return;
  const p = proj([picked.lon, picked.lat]); if (!p) return;
  g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.beginPath(); g.arc(p[0], p[1], 14, 0, 7); g.stroke();
  g.strokeStyle = 'rgba(255,106,26,.6)'; g.beginPath(); g.arc(p[0], p[1], 24, 0, 7); g.stroke();
}

function updateClock() {
  const ym = G.months[frameIdx], [y, m] = ym.split('-');
  $('clockM').textContent = `${T().months[+m-1]} ${y}`;
  $('clockN').innerHTML = `<b>${S.harmonized[frameIdx].toLocaleString(lang==='en'?'en-US':'ru-RU')}</b> ${T().fires}`;
  $('scrub').value = frameIdx;
}

function drawPulse() {
  const c = $('pulse'), g = c.getContext('2d'), w = c.width / DPR, h = c.height / DPR;
  g.setTransform(DPR,0,0,DPR,0,0); g.clearRect(0,0,w,h);
  const v = S.harmonized, max = d3.max(v), x = i => 16 + (w - 32) * i / (v.length - 1), y = n => h - 14 - (h - 28) * n / max;
  g.beginPath(); v.forEach((n, i) => i ? g.lineTo(x(i), y(n)) : g.moveTo(x(i), y(n)));
  g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 1.2; g.stroke();
  g.save(); g.beginPath(); g.rect(0, 0, x(frameIdx), h); g.clip();
  g.beginPath(); v.forEach((n, i) => i ? g.lineTo(x(i), y(n)) : g.moveTo(x(i), y(n)));
  g.strokeStyle = '#ff6a1a'; g.lineWidth = 2; g.shadowColor = '#ff6a1a'; g.shadowBlur = 10; g.stroke(); g.restore();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(x(frameIdx), y(v[frameIdx]), 3.5, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.35)'; g.font = '11px JetBrains Mono';
  G.months.forEach((ym, i) => { if (ym.endsWith('-01') && +ym.slice(0,4) % 5 === 0) g.fillText(ym.slice(0,4), x(i) - 14, h - 2); });
}

// --- calendar of the whole planet (or picked place) ---
function calendarOf(series, canvas, n) {
  const [w, h] = size(canvas, n || 300), g = canvas.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0); g.clearRect(0,0,w,h);
  const years = [...new Set(G.months.map(m => +m.slice(0,4)))], cw = (w - 40) / 12, ch = (h - 18) / years.length;
  const max = d3.quantile(series.filter(v => v > 0).sort(d3.ascending), .97) || 1;
  const color = d3.scaleSequential(t => d3.interpolateInferno(0.08 + 0.9 * t)).domain([0, Math.log1p(max)]).clamp(true);
  G.months.forEach((ym, i) => { const yi = years.indexOf(+ym.slice(0,4)), mi = +ym.slice(5) - 1;
    g.fillStyle = color(Math.log1p(series[i])); g.fillRect(40 + mi*cw + 1, 16 + yi*ch + .5, cw - 2, Math.max(1, ch - 1)); });
  g.fillStyle = '#9a9189'; g.font = '10px JetBrains Mono';
  T().months.forEach((m, i) => g.fillText(m[0], 40 + i*cw + cw/2 - 3, 10));
  years.forEach((y, i) => { if (y % 5 === 0 || i === 0) g.fillText(y, 0, 16 + i*ch + ch); });
}
const drawCalendar = () => calendarOf(S.harmonized, $('calendar'));

function drawHarm(t) {
  const c = $('harm'), [w, h] = size(c, 200), g = c.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0); g.clearRect(0,0,w,h);
  const yrs = [...new Set(G.months.map(m => m.slice(0,4)))].filter(y => y < G.months.at(-1).slice(0,4));
  const sum = arr => yrs.map(y => d3.sum(G.months.map((m, i) => m.startsWith(y) ? arr[i] : 0)));
  const raw = sum(S.raw), har = sum(S.harmonized), max = d3.max([...raw, ...har]);
  const x = i => 6 + (w - 12) * i / (yrs.length - 1), y = v => h - 22 - (h - 34) * v / max;
  const line = (arr, col, lw, k) => { g.beginPath(); arr.slice(0, Math.max(2, Math.ceil(arr.length * k))).forEach((v, i) => i ? g.lineTo(x(i), y(v)) : g.moveTo(x(i), y(v))); g.strokeStyle = col; g.lineWidth = lw; g.stroke(); };
  line(raw, '#777', 2, Math.min(1, t * 2));
  if (t > .5) { g.shadowColor = '#ff6a1a'; g.shadowBlur = 12; line(har, '#ff6a1a', 3, (t - .5) * 2); g.shadowBlur = 0; }
  const i12 = yrs.indexOf('2012'); g.strokeStyle = 'rgba(255,255,255,.25)'; g.setLineDash([3,4]); g.beginPath(); g.moveTo(x(i12), 8); g.lineTo(x(i12), h - 22); g.stroke(); g.setLineDash([]);
  g.fillStyle = '#9a9189'; g.font = '10px JetBrains Mono'; g.fillText('2012 · VIIRS', x(i12) + 4, 14);
  [0, yrs.length - 1].forEach(i => g.fillText(yrs[i], Math.min(w - 30, x(i)), h - 6));
}
function animateHarm() { if (REDUCED) return drawHarm(1); const t0 = performance.now(); const step = now => { const t = Math.min(1, (now - t0) / 2600); drawHarm(t); if (t < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
function valStat() {
  const v = S.validation, b = v.cell, r = v.raw;
  $('valStat').innerHTML = `<div><b>${b.bias_pct > 0 ? '+' : ''}${b.bias_pct}%</b><span>${T().vErr} ${r.bias_pct}%</span></div><div><b>${b.corr_cell_annual}</b><span>${T().vCorr}</span></div>`;
}

// --- pick any place: 3x3 cells around the click ---
function localSeries(lat, lon) {
  const r0 = Math.floor(lat) + 90, c0 = (Math.floor(lon) + 180 + 360) % 360, want = new Set();
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) want.add((r0 + dr) * 360 + (c0 + dc + 360) % 360);
  const idx = new Set(G.cells.map((c, i) => want.has(c) ? i : -1).filter(i => i >= 0));
  return G.frames.map(fr => { let s = 0; for (let k = 0; k < fr.length; k += 2) if (idx.has(fr[k])) s += fr[k+1]; return s; });
}
function drawLocal() {
  if (!picked) { $('hereTxt').textContent = T().pick; const c = $('local'); size(c, 230); c.getContext('2d').clearRect(0,0,c.width,c.height); return; }
  const s = picked.series, byMonth = d3.range(12).map(m => d3.median(G.months.map((ym, i) => +ym.slice(5) === m + 1 ? s[i] : null).filter(v => v !== null)));
  const yrs = d3.groups(G.months.map((ym, i) => [ym.slice(0,4), s[i]]), d => d[0]).map(([y, a]) => [y, d3.sum(a, d => d[1])]).filter(([y]) => y < G.months.at(-1).slice(0,4));
  const worst = d3.greatest(yrs, d => d[1]), med = d3.median(yrs, d => d[1]);
  $('hereTxt').innerHTML = `<b>${picked.lat.toFixed(1)}°, ${picked.lon.toFixed(1)}°</b> · ${T().peak}: <b>${T().months[byMonth.indexOf(d3.max(byMonth))]}</b> · ${T().worst}: <b>${worst[0]}</b> · <b>${Math.round(med).toLocaleString()}</b> ${T().perYear}`;
  calendarOf(s, $('local'), 230);
}
C.marks.parentElement.style.pointerEvents = 'auto';
addEventListener('click', e => {
  if (chapter !== 'explore' || e.target.closest('.card,.top,.player')) return;
  const ll = proj.invert([e.clientX, e.clientY]); if (!ll || !isFinite(ll[0])) return;
  picked = { lon: ll[0], lat: ll[1], series: localSeries(ll[1], ll[0]) };
  drawMarks(); drawLocal();
});

// --- playback ---
let last = 0, acc = 0;
const MS_PER_MONTH = 130;
function tick(now) {
  const dt = Math.min(500, now - (last || now)); last = now;
  if (playing && chapter !== 'kg') { acc += dt;
    if (acc >= MS_PER_MONTH) { acc = 0; frameIdx = (frameIdx + 1) % G.frames.length; drawFrame(frameIdx, .55); updateClock(); drawPulse(); } }
  requestAnimationFrame(tick);
}
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '❚❚' : '▶'; };
$('scrub').oninput = e => { frameIdx = +e.target.value; ctx.fire.clearRect(0,0,W,H); drawFrame(frameIdx, 1); updateClock(); drawPulse(); };

// --- chapters ---
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add('in');
  const ch = e.target.dataset.ch, prev = chapter; chapter = ch;
  document.body.classList.toggle('hero-on', ch === 'hero');
  $('clock').style.opacity = ch === 'hero' || ch === 'rhythm' || ch === 'explore' ? 1 : .25;
  if (ch === 'clocks') animateHarm();
  if (ch === 'kg') { // freeze on the latest November for Central Asia
    frameIdx = G.months.lastIndexOf(G.months.filter(m => m.endsWith('-11')).at(-1)); updateClock(); drawPulse();
  }
  if ((ch === 'kg') !== (prev === 'kg')) layout();
}), { threshold: .45 });
document.querySelectorAll('.chapter').forEach(s => io.observe(s));

// --- load ---
applyLang();
Promise.all([
  fetch('data/global/frames.json').then(r => r.json()),
  fetch('data/global/summary.json').then(r => r.json()),
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r => r.json()),
]).then(([g, s, topo]) => {
  G = g; S = s;
  world = { land: topojson.feature(topo, topo.objects.land), borders: topojson.mesh(topo, topo.objects.countries, (a, b) => a !== b) };
  G.p99 = d3.quantile(G.frames.flatMap(fr => fr.filter((_, k) => k % 2)).sort(d3.ascending), .99) || 10;
  $('scrub').max = G.frames.length - 1;
  layout(); drawCalendar(); valStat(); drawHarm(0); drawLocal(); updateClock();
  $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 900);
  if (REDUCED) { playing = false; $('play').textContent = '▶'; }
  requestAnimationFrame(tick);
});
addEventListener('resize', () => { if (G) { layout(); drawCalendar(); drawHarm(1); drawLocal(); } });
</script>
</body>
</html>
